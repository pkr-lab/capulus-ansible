---

ollama_pc_version: "0.40.16"
ollama_pc_install_script_url: "https://raw.githubusercontent.com/ollama/ollama/v{{ ollama_pc_version }}/scripts/install.sh"
ollama_pc_install_script_sha256: "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f"

ollama_pc_listen: "0.0.0.0:11434"
ollama_pc_port: 11434
ollama_pc_keep_alive: 5m
ollama_pc_flash_attention: 1
ollama_pc_kv_cache_type: q8_0
ollama_pc_context_length: 16384

ollama_pc_models:
  - gemma3:27b-it-q8_0
ollama_pc_pull_timeout_seconds: 7200

ollama_pc_interface: "{{ ansible_default_ipv4.interface }}"
ollama_pc_nm_connection: ""

ollama_pc_gpu_power_limit_watts: 280

ollama_pc_ufw_enabled: true
ollama_pc_ufw_allowed_sources:
  - "{{ hostvars['controlplane-0']['ansible_host'] }}"
ollama_pc_ufw_ssh_sources:
  - "{{ local_subnet }}"

ollama_pc_idle_suspend_enabled: true
ollama_pc_idle_suspend_minutes: 5
ollama_pc_idle_suspend_max_load: "1.0"

ollama_pc_hardening_enabled: true

ollama_pc_ssh_dir: "/home/{{ ansible_user }}/.ssh"
ollama_pc_ssh_private_key_files:
  - id_ed25519
  - prod_vm_ed25519
  - netcup-deploy
  - client-private.key
ollama_pc_ssh_public_key_files:
  - client-public.key

ollama_pc_stale_sudoers_files:
  - 010-pela-nopasswd

ollama_pc_rpcbind_disabled: true

ollama_pc_disabled_services: []

ollama_pc_security_tools_enabled: true
ollama_pc_security_packages:
  - smartmontools
  - lm-sensors
  - tpm2-tools
  - lynis
  - rkhunter
  - chkrootkit
  - clamav
  - auditd
  - debsums

ollama_pc_blocked_modules:
  - dccp
  - sctp
  - rds
  - tipc
