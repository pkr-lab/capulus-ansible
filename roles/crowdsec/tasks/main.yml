- name: gnupg für die schlüsselbehandlung installieren
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: verzeichnis für apt-keyrings anlegen
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: prüfen ob der keyring des crowdsec-repositorys existiert
  ansible.builtin.stat:
    path: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
  register: crowdsec_keyring

- name: schlüssel des crowdsec-repositorys herunterladen
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /tmp/crowdsec-repo.gpgkey
    mode: '0600'
  when: not crowdsec_keyring.stat.exists

- name: temporäres gnupg-home anlegen
  ansible.builtin.tempfile:
    state: directory
    prefix: crowdsec-gnupg-
  register: crowdsec_gnupg_home
  changed_when: false
  check_mode: false

- name: schlüssel des crowdsec-repositorys in einen keyring umwandeln
  ansible.builtin.command: >-
    gpg --homedir {{ crowdsec_gnupg_home.path }} --dearmor
    --output /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg /tmp/crowdsec-repo.gpgkey
  changed_when: true
  when: not crowdsec_keyring.stat.exists

- name: heruntergeladenen schlüssel des crowdsec-repositorys entfernen
  ansible.builtin.file:
    path: /tmp/crowdsec-repo.gpgkey
    state: absent

- name: fingerprint des crowdsec-keyrings lesen
  ansible.builtin.command: >-
    gpg --homedir {{ crowdsec_gnupg_home.path }} --show-keys --with-colons --fingerprint
    /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
  register: crowdsec_key_info
  changed_when: false
  check_mode: false
  when: crowdsec_keyring.stat.exists or not ansible_check_mode

- name: temporäres gnupg-home entfernen
  ansible.builtin.file:
    path: "{{ crowdsec_gnupg_home.path }}"
    state: absent
  changed_when: false
  check_mode: false

- name: fingerprint des crowdsec-repository-schlüssels prüfen
  ansible.builtin.assert:
    that:
      - "('fpr:::::::::' ~ crowdsec_repo_key_fingerprint ~ ':') in crowdsec_key_info.stdout"
    fail_msg: >-
      Der Fingerprint von /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg weicht von
      crowdsec_repo_key_fingerprint ab. Schlüssel nicht vertrauen, Ursache klären
      (https://github.com/pkr-lab/pkr-lab-docs/blob/main/capulus-ansible/6-hintergruende/60020-ansible-rollen.md, Abschnitt Installer und Prüfsummen).
  when: crowdsec_key_info.stdout is defined

- name: apt-repository für crowdsec eintragen
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/crowdsec_crowdsec.list
    content: |
      deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main
      deb-src [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main
    owner: root
    group: root
    mode: '0644'

- name: paket crowdsec installieren
  ansible.builtin.apt:
    name: crowdsec
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: dienst crowdsec aktivieren und starten
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true

- name: warten bis die lokale crowdsec-api verbindungen annimmt
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    timeout: 30

- name: paket crowdsec-firewall-bouncer installieren (iptables-backend, passend zu ufw)
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-iptables
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"

- name: dienst crowdsec-firewall-bouncer aktivieren und starten
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    state: started
    enabled: true

- name: crowdsec-collections installieren
  ansible.builtin.command: "cscli collections install {{ item }}"
  loop: "{{ crowdsec_collections }}"
  register: crowdsec_collection_install
  changed_when: "'already installed' not in crowdsec_collection_install.stdout"
  failed_when: >
    crowdsec_collection_install.rc != 0 and
    'already installed' not in crowdsec_collection_install.stdout

- name: sicherstellen dass das verzeichnis acquisition.d existiert
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: acquisition-konfiguration für ssh-logs ablegen (journald)
  ansible.builtin.template:
    src: acquis-ssh.yaml.j2
    dest: /etc/crowdsec/acquis.d/ssh.yaml
    owner: root
    group: root
    mode: '0644'
  notify: crowdsec neu starten

- name: acquisition-konfiguration für traefik-logs ablegen
  ansible.builtin.template:
    src: acquis-traefik.yaml.j2
    dest: /etc/crowdsec/acquis.d/traefik.yaml
    owner: root
    group: root
    mode: '0644'
  notify: crowdsec neu starten

- name: cidr-whitelist für lan und tailscale ablegen
  ansible.builtin.template:
    src: whitelist.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/local-whitelist.yaml
    owner: root
    group: root
    mode: '0644'
  notify: crowdsec neu starten

- name: handler sofort ausführen, damit acquisition und whitelist vor der prüfung wirken
  ansible.builtin.meta: flush_handlers

- name: prüfen dass der firewall-bouncer bei der lokalen api registriert ist
  ansible.builtin.command: cscli bouncers list -o json
  register: crowdsec_bouncers
  changed_when: false
  check_mode: false

- name: warnen wenn kein bouncer registriert ist
  ansible.builtin.debug:
    msg: >
      WARNING: `cscli bouncers list` returned no registered bouncer.
      crowdsec-firewall-bouncer likely failed to auto-register — check
      `journalctl -u crowdsec-firewall-bouncer` and https://github.com/pkr-lab/pkr-lab-docs/blob/main/capulus-ansible/d-sicherheit/d0020-crowdsec.md.
  when: "'[]' in crowdsec_bouncers.stdout"
