---
- name: start-limit des dienstes zurücksetzen (nach endlos-fehlschlägen)
  ansible.builtin.command: systemctl reset-failed systemd-journal-upload.service
  changed_when: false
  failed_when: false

- name: systemd-journal-upload neu starten
  ansible.builtin.systemd:
    name: systemd-journal-upload.service
    daemon_reload: true
    state: restarted
