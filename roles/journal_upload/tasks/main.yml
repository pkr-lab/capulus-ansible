---

- name: systemd-journal-remote installieren (liefert systemd-journal-upload)
  ansible.builtin.apt:
    name: systemd-journal-remote
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: journal_upload_enabled | bool

- name: homeserver-root-ca verteilen (tls-prüfung des log-endpunkts)
  ansible.builtin.include_role:
    name: homeserver_ca
  vars:
    homeserver_ca_src: "{{ journal_upload_ca_src }}"
    homeserver_ca_dest: "{{ journal_upload_ca_dest }}"
  when: journal_upload_enabled | bool and journal_upload_push_url.startswith('https://')

- name: journal-upload nach einem ca-wechsel neu starten
  ansible.builtin.debug:
    msg: "Homeserver-Root-CA wurde aktualisiert"
  changed_when: true
  notify: systemd-journal-upload neu starten
  when:
    - journal_upload_enabled | bool and journal_upload_push_url.startswith('https://')
    - homeserver_ca_result is defined and homeserver_ca_result is changed

- name: Log-Endpunkt per /etc/hosts auflösen (unabhängig von DNS)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ journal_upload_hosts_entry_name | regex_escape }}(\s|$)'
    line: "{{ journal_upload_hosts_entry_ip }} {{ journal_upload_hosts_entry_name }}"
    owner: root
    group: root
    mode: "0644"
  when: journal_upload_enabled | bool and journal_upload_hosts_entry_enabled | bool
  notify: systemd-journal-upload neu starten

- name: Drop-in-Verzeichnis für systemd-journal-upload anlegen
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-journal-upload.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: journal_upload_enabled | bool

- name: Dauerhaften Neustart für systemd-journal-upload konfigurieren
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-journal-upload.service.d/restart.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=30
  when: journal_upload_enabled | bool
  notify: systemd-journal-upload neu starten

- name: Gruppe für die Zugangsdaten des Log-Endpunkts anlegen
  ansible.builtin.group:
    name: "{{ journal_upload_credentials_group }}"
    system: true
  when: journal_upload_enabled | bool and journal_upload_basic_auth_password | length > 0

- name: Dienst für den Zugriff auf die Zugangsdaten berechtigen
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-journal-upload.service.d/credentials.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      SupplementaryGroups={{ journal_upload_credentials_group }}
  when: journal_upload_enabled | bool and journal_upload_basic_auth_password | length > 0
  notify: systemd-journal-upload neu starten

- name: journal-upload.conf deployen
  ansible.builtin.template:
    src: journal-upload.conf.j2
    dest: /etc/systemd/journal-upload.conf
    owner: root
    group: "{{ journal_upload_credentials_group if journal_upload_basic_auth_password | length > 0 else 'root' }}"
    mode: "{{ '0640' if journal_upload_basic_auth_password | length > 0 else '0644' }}"
  no_log: "{{ journal_upload_basic_auth_password | length > 0 }}"
  when: journal_upload_enabled | bool
  notify: systemd-journal-upload neu starten

- name: Startpunkt für systemd-journal-upload setzen (kein Upload des Alt-Journals)
  when: journal_upload_enabled | bool
  block:
    - name: State-Verzeichnis prüfen
      ansible.builtin.stat:
        path: "{{ journal_upload_state_dir }}"
      register: journal_upload_state_dir_stat

    - name: State-Datei prüfen
      ansible.builtin.stat:
        path: "{{ journal_upload_state_dir }}/state"
      register: journal_upload_state_stat

    - name: Aktuellen Journal-Cursor ermitteln
      ansible.builtin.command: journalctl -q -n 1 --show-cursor
      register: journal_upload_start_cursor
      changed_when: false
      check_mode: false
      when: not journal_upload_state_stat.stat.exists

    - name: State-Verzeichnis anlegen
      ansible.builtin.file:
        path: "{{ journal_upload_state_dir }}"
        state: directory
        mode: "0755"
      when: not journal_upload_state_stat.stat.exists

    - name: State-Datei mit Startpunkt anlegen
      ansible.builtin.copy:
        dest: "{{ journal_upload_state_dir }}/state"
        owner: "{{ journal_upload_state_dir_stat.stat.uid | default(0) }}"
        group: "{{ journal_upload_state_dir_stat.stat.gid | default(0) }}"
        mode: "0600"
        content: |
          # This is private data. Do not parse.
          LAST_CURSOR={{ journal_upload_start_cursor.stdout_lines | last | regex_replace('^-- cursor: ', '') }}
      when:
        - not journal_upload_state_stat.stat.exists
        - journal_upload_start_cursor.stdout_lines | length > 0
      notify:
        - start-limit des dienstes zurücksetzen (nach endlos-fehlschlägen)
        - systemd-journal-upload neu starten

    - name: Handler sofort ausführen (Start-Limit zurücksetzen, bevor der Dienst gestartet wird)
      ansible.builtin.meta: flush_handlers

- name: systemd-journal-upload aktivieren und starten
  ansible.builtin.systemd:
    name: systemd-journal-upload.service
    daemon_reload: true
    enabled: true
    state: started
  when: journal_upload_enabled | bool

- name: systemd-journal-upload deaktivieren (journal_upload_enabled false)
  ansible.builtin.systemd:
    name: systemd-journal-upload.service
    enabled: false
    state: stopped
  when: not (journal_upload_enabled | bool)
  register: journal_upload_deaktivieren_result
  failed_when:
    - journal_upload_deaktivieren_result is failed
    - "'Could not find' not in (journal_upload_deaktivieren_result.msg | default(''))"
