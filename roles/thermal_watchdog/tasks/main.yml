---

- name: lm-sensors installieren (hwmon-kernel-module / sysfs-hilfen)
  ansible.builtin.apt:
    name: lm-sensors
    state: present
  when: thermal_watchdog_enabled | bool

- name: thermal-watchdog-skript ablegen
  ansible.builtin.copy:
    src: thermal-watchdog.sh
    dest: /usr/local/bin/thermal-watchdog.sh
    owner: root
    group: root
    mode: "0755"
  when: thermal_watchdog_enabled | bool
  notify: thermal-watchdog neu starten

- name: systemd-unit des thermal-watchdogs ablegen
  ansible.builtin.template:
    src: thermal-watchdog.service.j2
    dest: /etc/systemd/system/thermal-watchdog.service
    owner: root
    group: root
    mode: "0644"
  when: thermal_watchdog_enabled | bool
  notify: thermal-watchdog neu starten

- name: thermal-watchdog aktivieren und starten
  ansible.builtin.systemd:
    name: thermal-watchdog
    daemon_reload: true
    enabled: true
    state: started
  when: thermal_watchdog_enabled | bool

- name: thermal-watchdog deaktivieren, wenn thermal_watchdog_enabled aus ist
  ansible.builtin.systemd:
    name: thermal-watchdog
    enabled: false
    state: stopped
  when: not (thermal_watchdog_enabled | bool)
  register: thermal_watchdog_deaktivieren_result
  failed_when:
    - thermal_watchdog_deaktivieren_result is failed
    - "'Could not find' not in (thermal_watchdog_deaktivieren_result.msg | default(''))"
