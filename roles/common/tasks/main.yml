---

- name: hostnamen setzen
  ansible.builtin.hostname:
    name: "{{ hostname }}"
    use: systemd

- name: hostnamen in /etc/hosts eintragen
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ hostname }}"
    state: present

- name: apt-cache aktualisieren
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: alle pakete aktualisieren (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: auto_upgrade | bool

- name: benötigte systempakete installieren
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-kubernetes
      - nfs-common
      - open-iscsi
      - chrony
      - jq
      - unzip
      - net-tools
      - htop
      - vim
      - bash-completion
      - ufw
      - unattended-upgrades
      - update-notifier-common
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"

- name: unattended-upgrades einschalten (sicherheitsupdates zwischen den ansible-läufen)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      // Managed by Ansible — controls unattended-upgrades cadence.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: unattended-upgrades auch für "updates" und zum aufräumen einrichten
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-home-server
    owner: root
    group: root
    mode: '0644'
    content: |
      // Managed by Ansible.
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
          "${distro_id}:${distro_codename}-updates";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: sicherstellen dass der dienst unattended-upgrades aktiviert ist
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: zeitzone setzen
  community.general.timezone:
    name: "{{ timezone }}"
  notify: chrony neu starten

- name: chrony aktivieren und starten
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: kubernetes-voraussetzungen herstellen (swap, kernel-module, sysctl)
  ansible.builtin.import_tasks: k8s_prerequisites.yml

- name: ssh (port 22) vor allen anderen firewall-änderungen erlauben
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH"

- name: ufw-standardrichtlinie für eingehenden verkehr auf deny setzen
  community.general.ufw:
    default: deny
    direction: incoming

- name: ufw-standardrichtlinie für ausgehenden verkehr auf allow setzen
  community.general.ufw:
    default: allow
    direction: outgoing

- name: http (port 80) für den traefik-ingress erlauben
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "HTTP Traefik ingress"

- name: https (port 443) erlauben
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "HTTPS Traefik ingress"

- name: k3s-api (6443) nur von den freigegebenen quellen erlauben
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "{{ item }}"
    comment: "k3s API ({{ item }})"
  loop: "{{ common_ufw_k3s_api_sources }}"

- name: regeln für den argocd-nodeport 30080 entfernen (nodeport entfällt, argocd läuft über den ingress)
  community.general.ufw:
    rule: allow
    port: "30080"
    proto: tcp
    src: "{{ item }}"
    delete: true
  loop:
    - "{{ local_subnet }}"
    - "100.64.0.0/10"
    - "10.99.99.0/24"

- name: offene regel für den argocd-nodeport 30080 entfernen (manuell gesetzt, jetzt auf lan/tailnet begrenzt)
  community.general.ufw:
    rule: allow
    port: "30080"
    proto: tcp
    delete: true

- name: nutzlose regel für den argocd-nodeport 30443 entfernen (server spricht dort klartext, kein tls)
  community.general.ufw:
    rule: allow
    port: "30443"
    proto: tcp
    delete: true

- name: tailscale-wireguard (udp 41641) erlauben
  community.general.ufw:
    rule: allow
    port: "41641"
    proto: udp
    comment: "Tailscale WireGuard VPN"

- name: flannel-vxlan (udp 8472) und kubelet (10250) nur aus dem lan erlauben
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ local_subnet }}"
  loop:
    - {port: "8472", proto: udp}
    - {port: "10250", proto: tcp}
  when: common_ufw_lan_allow_all | bool

- name: offene k3s-regeln für alle quellen entfernen (6443, 10250, 8472)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop:
    - {port: "6443", proto: tcp}
    - {port: "10250", proto: tcp}
    - {port: "8472", proto: udp}

- name: gesamten verkehr aus dem pod-cidr von k3s erlauben
  community.general.ufw:
    rule: allow
    src: "{{ k3s_pod_cidr }}"
    comment: "k3s pod CIDR traffic"

- name: gesamten verkehr aus dem service-cidr von k3s erlauben
  community.general.ufw:
    rule: allow
    src: "{{ k3s_service_cidr }}"
    comment: "k3s service CIDR traffic"

- name: gesamten verkehr aus dem lokalen lan erlauben
  community.general.ufw:
    rule: allow
    src: "{{ local_subnet }}"
    comment: "Local LAN subnet access"
  when: common_ufw_lan_allow_all | bool

- name: gesamten verkehr aus dem tailscale-netz erlauben
  community.general.ufw:
    rule: allow
    src: "100.64.0.0/10"
    comment: "Tailscale VPN network"
  when: common_ufw_tailnet_allow_all | bool

- name: infrastruktur-hosts mit vollzugriff erlauben
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: "Infrastruktur-Host (Vollzugriff)"
  loop: "{{ common_ufw_trusted_hosts }}"
  when: not (common_ufw_lan_allow_all | bool)

- name: dienste für das lan freigeben
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ local_subnet }}"
    comment: "{{ item.comment }}"
  loop: "{{ common_ufw_lan_services }}"
  when: not (common_ufw_lan_allow_all | bool)

- name: pauschale lan-regel entfernen
  community.general.ufw:
    rule: allow
    src: "{{ local_subnet }}"
    delete: true
  when: not (common_ufw_lan_allow_all | bool)

- name: pauschale tailnet-regel entfernen
  community.general.ufw:
    rule: allow
    src: "100.64.0.0/10"
    delete: true
  when: not (common_ufw_tailnet_allow_all | bool)

- name: ufw aktivieren
  community.general.ufw:
    state: enabled

- name: prüfen dass ufw aktiv ist
  ansible.builtin.command: ufw status verbose
  register: common_ufw_status
  changed_when: false

- name: ufw-status anzeigen
  ansible.builtin.debug:
    var: common_ufw_status.stdout_lines

- name: statische ip per netplan einrichten
  when: network_configure_static_ip | bool
  block:
    - name: vorhandene netplan-konfigurationen suchen
      ansible.builtin.find:
        paths: /etc/netplan
        patterns:
          - "*.yaml"
          - "*.yml"
        excludes:
          - "99-static.yaml"
      register: common_netplan_existing

    - name: vorhandene netplan-dhcp-konfigurationen entfernen
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ common_netplan_existing.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: statische netplan-konfiguration ablegen
      ansible.builtin.template:
        src: netplan-static.yaml.j2
        dest: /etc/netplan/99-static.yaml
        owner: root
        group: root
        mode: '0600'

    - name: netplan-konfiguration anwenden (verbindung bricht kurz ab)
      ansible.builtin.command: netplan apply
      async: 10
      poll: 0
      changed_when: true

    - name: warten bis der server unter der neuen statischen ip erreichbar ist
      ansible.builtin.wait_for:
        host: "{{ network_static_ip }}"
        port: 22
        delay: 5
        timeout: 60
      delegate_to: localhost
      become: false

- name: prüfen ob ein reboot nötig ist (kernel-/libc-updates)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: reboot bei k3s-servern nur nach etcd-prüfung freigeben
  ansible.builtin.import_role:
    name: k3s_reboot_guard
  when:
    - common_reboot_required.stat.exists
    - auto_reboot_if_required | bool

- name: server neu starten, weil /var/run/reboot-required gesetzt ist
  ansible.builtin.reboot:
    msg: "Reboot triggered by Ansible: kernel/libc update applied"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
    post_reboot_delay: 30
    test_command: uptime
  when:
    - common_reboot_required.stat.exists
    - auto_reboot_if_required | bool
    - k3s_reboot_guard_ok | default(true) | bool
    - lookup('env', 'SEMAPHORE_TASK_ID') | length == 0

- name: reboot nötig, aber auto_reboot_if_required ist false — betreiber warnen
  ansible.builtin.debug:
    msg: >
      A reboot is required (/var/run/reboot-required exists) but
      `auto_reboot_if_required` is false. Reboot the server manually with
      `sudo reboot` to finalize kernel/libc updates.
  when:
    - common_reboot_required.stat.exists
    - not (auto_reboot_if_required | bool)
    - lookup('env', 'SEMAPHORE_TASK_ID') | length == 0

- name: reboot nötig, aber semaphore führt diesen task aus — warnen statt sich selbst abzuschießen
  ansible.builtin.debug:
    msg: >
      A reboot is required (/var/run/reboot-required exists) but this playbook
      is running inside Semaphore (SEMAPHORE_TASK_ID is set). Auto-reboot is
      skipped to avoid killing the executor Pod. Reboot manually after the run
      finishes: `ssh ubuntu@homeserver "sudo reboot"`.
  when:
    - common_reboot_required.stat.exists
    - lookup('env', 'SEMAPHORE_TASK_ID') | length > 0

- name: nicht benötigte dienste stoppen und deaktivieren
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ common_disabled_services }}"
  register: common_disabled_services_result
  failed_when:
    - common_disabled_services_result is failed
    - "'Could not find' not in (common_disabled_services_result.msg | default(''))"
