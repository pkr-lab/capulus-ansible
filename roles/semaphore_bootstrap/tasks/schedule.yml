---

- name: vorhandene schedules im projekt {{ project_spec.name }} auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/schedules"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_sched_existing

- name: feststellen ob schedule '{{ schedule_spec.name }}' existiert
  ansible.builtin.set_fact:
    schedule_exists: >-
      {{ (sem_sched_existing.json
          | selectattr('name', 'equalto', schedule_spec.name)
          | list | length) > 0 }}

- name: id des vorhandenen schedules '{{ schedule_spec.name }}' ermitteln
  ansible.builtin.set_fact:
    schedule_id: >-
      {{ (sem_sched_existing.json
           | selectattr('name', 'equalto', schedule_spec.name)
           | list | first | default({})).id | default(none) }}
  when: schedule_exists

- name: sicherstellen dass template '{{ schedule_spec.template }}' für schedule '{{ schedule_spec.name }}' existiert
  ansible.builtin.assert:
    that: "schedule_spec.template in project_template_map"
    fail_msg: >-
      Schedule '{{ schedule_spec.name }}' references unknown template
      '{{ schedule_spec.template }}' in project '{{ project_spec.name }}'.
      Available templates: {{ project_template_map.keys() | list }}.

- name: schedule '{{ schedule_spec.name }}' anlegen
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/schedules"
    method: POST
    body_format: json
    body: >-
      {{
        {
          'project_id': project_id | int,
          'template_id': project_template_map[schedule_spec.template] | int,
          'name': schedule_spec.name,
          'cron_format': schedule_spec.cron,
          'active': schedule_spec.active | default(true),
        }
      }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
    status_code: [200, 201, 204]
  when: not schedule_exists

- name: schedule '{{ schedule_spec.name }}' aktualisieren
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/schedules/{{ schedule_id | int }}"
    method: PUT
    body_format: json
    body: >-
      {{
        {
          'id': schedule_id | int,
          'project_id': project_id | int,
          'template_id': project_template_map[schedule_spec.template] | int,
          'name': schedule_spec.name,
          'cron_format': schedule_spec.cron,
          'active': schedule_spec.active | default(true),
        }
      }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
    status_code: [200, 204]
  when: schedule_exists
  changed_when: false
