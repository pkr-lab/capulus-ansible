---

- name: vorhandene keys im projekt {{ project_spec.name }} auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_keys_existing

- name: feststellen ob der key im projekt {{ project_spec.name }} existiert
  ansible.builtin.set_fact:
    key_exists: >-
      {{ (sem_keys_existing.json
          | selectattr('name', 'equalto', key_spec.name)
          | list | length) > 0 }}

- name: privaten ssh-schlüssel von semaphore von der platte lesen
  ansible.builtin.slurp:
    src: "{{ semaphore_ssh_private_key_path }}"
  register: sem_ssh_priv_slurp
  no_log: true
  when:
    - key_spec.type == "ssh"

- name: ssh-zugangsschlüssel im projekt {{ project_spec.name }} anlegen
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys"
    method: POST
    body_format: raw
    body: >-
      {{ {'name': key_spec.name, 'type': 'ssh', 'project_id': project_id | int,
          'ssh': {'login': key_spec.login, 'passphrase': '',
                  'private_key': (sem_ssh_priv_slurp.content | b64decode | trim) + semaphore_pem_newline}
         } | to_json }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
      Content-Type: "application/json"
    status_code: [200, 201, 204]
    return_content: true
  no_log: true
  register: sem_key_create
  failed_when: false
  when:
    - not key_exists
    - key_spec.type == "ssh"

- name: mit sichtbaren http-details abbrechen, wenn das anlegen des ssh-schlüssels fehlschlug
  ansible.builtin.fail:
    msg: >-
      SSH key creation returned HTTP {{ sem_key_create.status }}:
      {{ sem_key_create.content | default(sem_key_create.json | default('no body') | string) }}
  when:
    - not key_exists
    - key_spec.type == "ssh"
    - sem_key_create is not skipped
    - sem_key_create.status not in [200, 201, 204]

- name: id des vorhandenen ssh-schlüssels {{ key_spec.name }} ermitteln
  ansible.builtin.set_fact:
    _existing_ssh_key_id: >-
      {{ (sem_keys_existing.json
          | selectattr('name', 'equalto', key_spec.name)
          | list | first | default({})).id | default(none) }}
  when:
    - key_exists
    - key_spec.type == "ssh"

- name: ssh-schlüssel {{ key_spec.name }} im projekt {{ project_spec.name }} aktualisieren
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys/{{ _existing_ssh_key_id }}"
    method: PUT
    body_format: raw
    body: >-
      {{ {'id': _existing_ssh_key_id | int, 'name': key_spec.name,
          'type': 'ssh', 'project_id': project_id | int,
          'override_secret': true,
          'ssh': {'login': key_spec.login, 'passphrase': '',
                  'private_key': (sem_ssh_priv_slurp.content | b64decode | trim) + semaphore_pem_newline}
         } | to_json }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
      Content-Type: "application/json"
    status_code: [200, 204]
  no_log: true
  changed_when: false
  when:
    - key_exists
    - key_spec.type == "ssh"

- name: zugangsschlüssel vom typ none im projekt {{ project_spec.name }} anlegen
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys"
    method: POST
    body_format: raw
    body: >-
      {{ {'name': key_spec.name, 'type': 'none', 'project_id': project_id | int} | to_json }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
      Content-Type: "application/json"
    status_code: [200, 201, 204]
  when:
    - not key_exists
    - key_spec.type == "none"

- name: schlüssel vom typ login_password im projekt {{ project_spec.name }} anlegen
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys"
    method: POST
    body_format: raw
    body: >-
      {{ {'name': key_spec.name, 'type': 'login_password', 'project_id': project_id | int,
          'login_password': {'login': '', 'password': semaphore_vault_password}
         } | to_json }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
      Content-Type: "application/json"
    status_code: [200, 201, 204]
  no_log: true
  register: sem_vaultkey_create
  failed_when: false
  when:
    - not key_exists
    - key_spec.type == "login_password"

- name: mit http-details abbrechen, wenn das anlegen des vault-schlüssels fehlschlug
  ansible.builtin.fail:
    msg: >-
      Vault key creation returned HTTP {{ sem_vaultkey_create.status }}:
      {{ sem_vaultkey_create.content | default(sem_vaultkey_create.msg | default('no message')) }}
  when:
    - not key_exists
    - key_spec.type == "login_password"
    - sem_vaultkey_create is not skipped
    - sem_vaultkey_create.status not in [200, 201, 204]

- name: id des vorhandenen login_password-schlüssels {{ key_spec.name }} ermitteln
  ansible.builtin.set_fact:
    _existing_key_id: >-
      {{ (sem_keys_existing.json
          | selectattr('name', 'equalto', key_spec.name)
          | list | first | default({})).id | default(none) }}
  when:
    - key_exists
    - key_spec.type == "login_password"

- name: login_password-schlüssel {{ key_spec.name }} im projekt {{ project_spec.name }} aktualisieren
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys/{{ _existing_key_id }}"
    method: PUT
    body_format: raw
    body: >-
      {{ {'id': _existing_key_id | int, 'name': key_spec.name,
          'type': 'login_password', 'project_id': project_id | int,
          'override_secret': true,
          'login_password': {'login': '', 'password': semaphore_vault_password}
         } | to_json }}
    headers:
      Cookie: "{{ semaphore_cookie }}"
      Content-Type: "application/json"
    status_code: [200, 204]
  no_log: true
  changed_when: false
  when:
    - key_exists
    - key_spec.type == "login_password"
