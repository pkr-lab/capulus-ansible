---

- name: vorhandene projekte für {{ project_spec.name }} auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/projects"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_projects_list

- name: projekt-id für {{ project_spec.name }} ermitteln
  ansible.builtin.set_fact:
    project_id: >-
      {{ (sem_projects_list.json
           | selectattr('name', 'equalto', project_spec.name)
           | list | first | default({})).id | default(none) }}

- name: projekt {{ project_spec.name }} anlegen
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/projects"
    method: POST
    body_format: json
    body:
      name: "{{ project_spec.name }}"
      alert: false
      max_parallel_tasks: 0
      type: ""
    headers:
      Cookie: "{{ semaphore_cookie }}"
    status_code: [200, 201]
    return_content: true
  register: sem_project_create
  when: project_id in [none, "None", ""]

- name: neue projekt-id für {{ project_spec.name }} übernehmen
  ansible.builtin.set_fact:
    project_id: "{{ sem_project_create.json.id }}"
  when:
    - project_id in [none, "None", ""]
    - sem_project_create is not skipped

- name: standard-zugangsschlüssel im projekt {{ project_spec.name }} einrichten
  ansible.builtin.include_tasks: key.yml
  loop: "{{ semaphore_default_keys }}"
  loop_control:
    loop_var: key_spec
    label: "{{ key_spec.name }}"

- name: keys im projekt {{ project_spec.name }} erneut auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/keys"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_keys_list

- name: zuordnung key-name→id für das projekt {{ project_spec.name }} bilden
  ansible.builtin.set_fact:
    project_key_map: >-
      {{ dict(sem_keys_list.json
              | map(attribute='name') | zip(sem_keys_list.json | map(attribute='id'))) }}

- name: repository für das projekt {{ project_spec.name }} einrichten
  ansible.builtin.include_tasks: repository.yml

- name: inventories für das projekt {{ project_spec.name }} einrichten
  ansible.builtin.include_tasks: inventory.yml
  loop: "{{ project_spec.inventories }}"
  loop_control:
    loop_var: inventory_spec
    label: "{{ inventory_spec.name }}"

- name: inventories im projekt {{ project_spec.name }} erneut auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/inventory"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_inv_list

- name: zuordnung inventory-name→id für das projekt {{ project_spec.name }} bilden
  ansible.builtin.set_fact:
    project_inventory_map: >-
      {{ dict(sem_inv_list.json
              | map(attribute='name') | zip(sem_inv_list.json | map(attribute='id'))) }}

- name: environments für das projekt {{ project_spec.name }} einrichten
  ansible.builtin.include_tasks: environment.yml
  loop: "{{ project_spec.environments | default([]) }}"
  loop_control:
    loop_var: env_spec
    label: "{{ env_spec.name }}"

- name: environments im projekt {{ project_spec.name }} erneut auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/environment"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_env_list

- name: zuordnung environment-name→id für das projekt {{ project_spec.name }} bilden
  ansible.builtin.set_fact:
    project_environment_map: >-
      {{ dict(sem_env_list.json
              | map(attribute='name') | zip(sem_env_list.json | map(attribute='id'))) }}

- name: templates für das projekt {{ project_spec.name }} einrichten
  ansible.builtin.include_tasks: template.yml
  loop: "{{ project_spec.templates }}"
  loop_control:
    loop_var: template_spec
    label: "{{ template_spec.name }}"

- name: templates im projekt {{ project_spec.name }} erneut auflisten
  ansible.builtin.uri:
    url: "{{ semaphore_api_base }}/api/project/{{ project_id }}/templates"
    method: GET
    headers:
      Cookie: "{{ semaphore_cookie }}"
    return_content: true
  register: sem_tpl_list

- name: zuordnung template-name→id für das projekt {{ project_spec.name }} bilden
  ansible.builtin.set_fact:
    project_template_map: >-
      {{ dict(sem_tpl_list.json
              | map(attribute='name') | zip(sem_tpl_list.json | map(attribute='id'))) }}

- name: schedules für das projekt {{ project_spec.name }} einrichten
  ansible.builtin.include_tasks: schedule.yml
  loop: "{{ project_spec.schedules | default([]) }}"
  loop_control:
    loop_var: schedule_spec
    label: "{{ schedule_spec.name }}"
