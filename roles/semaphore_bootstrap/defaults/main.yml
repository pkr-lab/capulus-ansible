---
semaphore_api_base: "https://semaphore-api.tech.homeserver"

semaphore_namespace: semaphore

semaphore_ansible_repo_url: "https://github.com/pkr-lab/capulus-ansible.git"

semaphore_admin_password_path: "/etc/semaphore-secrets/admin_password"
semaphore_admin_username: admin

semaphore_ssh_private_key_path: "/etc/semaphore-secrets/id_ed25519"

semaphore_api_ready_retries: 60
semaphore_api_ready_delay: 5

semaphore_vault_password: ""

semaphore_ssh_login: "ubuntu"

semaphore_default_keys:
  - name: semaphore-ssh-key
    type: ssh
    login: "{{ semaphore_ssh_login }}"
  - name: git-none
    type: none
  - name: vault-password
    type: login_password

semaphore_default_environment:
  name: default-env
  env:
    ANSIBLE_VAULT_PASSWORD_FILE: /var/run/semaphore-secrets/ansible_vault_password

semaphore_projects:
  - name: home-server
    description: "Deploy / re-provision the home-server itself."
    repository:
      name: home-server-git
      url: "{{ semaphore_ansible_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: homeservers
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [k3s_servers]
          controlplane-0 ansible_host=192.168.178.94
          controlplane-1 ansible_host=192.168.178.95

          [k3s_primary]
          controlplane-0

          [k3s_agents]
          worker-1 ansible_host=192.168.178.96

          [entw]
          entw-vm ansible_host=192.168.178.100 ansible_user=ubuntu

          [prod]
          prod-vm ansible_host=192.168.178.99 ansible_user=ubuntu

          [ugreen_nas]
          ugreen-nas ansible_host=192.168.178.97
    templates:
      - name: "Deploy Home Server"
        playbook: site.yml
        inventory: homeservers
        environment: default-env
        vault_key: vault-password
        description: "Run the full site.yml against the home-server (recursive)."
    schedules:
      - name: "Daily 06:00"
        template: "Deploy Home Server"
        cron: "0 6 * * *"
        active: true

  - name: worker-0
    description: "Deploy k3s-Agent + Watchdogs auf worker-0 (192.168.178.95)."
    repository:
      name: home-server-git
      url: "{{ semaphore_ansible_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: worker_0_only
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [k3s_servers]
          controlplane-1 ansible_host=192.168.178.95

          [k3s_primary]
          controlplane-0 ansible_host=192.168.178.94
    templates:
      - name: "Deploy worker-0"
        playbook: controlplane-1.yml
        inventory: worker_0_only
        environment: default-env
        vault_key: vault-password
        description: "apt-Update, k3s-Agent, thermal_watchdog, resource_watchdog auf worker-0."
