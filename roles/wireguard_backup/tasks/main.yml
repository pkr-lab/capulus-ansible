---

- name: wireguard-tools installieren
  ansible.builtin.apt:
    name: wireguard
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: sicherstellen dass /etc/wireguard mit restriktiven rechten existiert
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: prüfen ob schon ein privater server-schlüssel existiert
  ansible.builtin.stat:
    path: "/etc/wireguard/{{ wireguard_backup_interface }}.privatekey"
  register: wireguard_backup_privkey_stat

- name: privaten server-schlüssel erzeugen (nur beim ersten lauf)
  ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/{{ wireguard_backup_interface }}.privatekey
  when: not wireguard_backup_privkey_stat.stat.exists
  changed_when: true

- name: privaten server-schlüssel lesen
  ansible.builtin.slurp:
    src: "/etc/wireguard/{{ wireguard_backup_interface }}.privatekey"
  register: wireguard_backup_privkey_raw
  no_log: true

- name: öffentlichen server-schlüssel ableiten
  ansible.builtin.command: wg pubkey
  args:
    stdin: "{{ wireguard_backup_privkey_raw.content | b64decode }}"
  register: wireguard_backup_pubkey_result
  changed_when: false
  no_log: true

- name: konfiguration des wireguard-backup-tunnels templaten
  ansible.builtin.template:
    src: wg-backup.conf.j2
    dest: "/etc/wireguard/{{ wireguard_backup_interface }}.conf"
    owner: root
    group: root
    mode: '0600'
  diff: false
  notify: wireguard-backup-tunnel neu starten

- name: backup-port von wireguard in ufw freigeben
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_backup_port }}"
    proto: udp
    comment: "WireGuard backup VPN (Tailscale-Ausfallsicherung, siehe https://github.com/pkr-lab/pkr-lab-docs/blob/main/capulus-core/c-netzwerk-dns/c0011-wireguard-backup.md)"

- name: wg-quick-dienst für den backup-tunnel aktivieren und starten
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_backup_interface }}"
    state: started
    enabled: true
    daemon_reload: true

- name: öffentlichen server-schlüssel und verbindungsdaten anzeigen
  ansible.builtin.debug:
    msg:
      - "WireGuard backup interface: {{ wireguard_backup_interface }}"
      - "Server public key: {{ wireguard_backup_pubkey_result.stdout }}"
      - "Listen port (UDP): {{ wireguard_backup_port }}"
      - "Peer configured: {{ 'yes (' + wireguard_backup_peer_name + ')' if wireguard_backup_peer_public_key | default('') | length > 0 else 'NO — set wireguard_backup_peer_public_key in group_vars/all.yml' }}"
      - "Reminder: forward UDP {{ wireguard_backup_port }} on your router to this host's LAN IP — see https://github.com/pkr-lab/pkr-lab-docs/blob/main/capulus-core/c-netzwerk-dns/c0011-wireguard-backup.md"
