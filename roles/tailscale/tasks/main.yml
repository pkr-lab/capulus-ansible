---

- name: verzeichnis für apt-keyrings anlegen
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: gpg-signaturschlüssel von tailscale herunterladen
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }}/{{ tailscale_repo_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
    force: false

- name: prüfen ob der tailscale-keyring existiert
  ansible.builtin.stat:
    path: /usr/share/keyrings/tailscale-archive-keyring.gpg
  register: tailscale_keyring

- name: gnupg für die fingerprint-prüfung installieren
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: temporäres gnupg-home anlegen
  ansible.builtin.tempfile:
    state: directory
    prefix: tailscale-gnupg-
  register: tailscale_gnupg_home
  changed_when: false
  check_mode: false

- name: fingerprint des tailscale-signaturschlüssels lesen
  ansible.builtin.command: >-
    gpg --homedir {{ tailscale_gnupg_home.path }} --show-keys --with-colons --fingerprint
    /usr/share/keyrings/tailscale-archive-keyring.gpg
  register: tailscale_key_info
  changed_when: false
  check_mode: false
  when: tailscale_keyring.stat.exists or not ansible_check_mode

- name: temporäres gnupg-home entfernen
  ansible.builtin.file:
    path: "{{ tailscale_gnupg_home.path }}"
    state: absent
  changed_when: false
  check_mode: false

- name: fingerprint des tailscale-signaturschlüssels prüfen
  ansible.builtin.assert:
    that:
      - "('fpr:::::::::' ~ tailscale_signing_key_fingerprint ~ ':') in tailscale_key_info.stdout"
    fail_msg: >-
      Der Fingerprint von /usr/share/keyrings/tailscale-archive-keyring.gpg weicht von
      tailscale_signing_key_fingerprint ab. Schlüssel nicht vertrauen, Ursache klären
      (https://github.com/pkr-lab/pkr-lab-docs/blob/main/capulus-ansible/6-hintergruende/60020-ansible-rollen.md, Abschnitt Installer und Prüfsummen).
  when: tailscale_key_info.stdout is defined

- name: apt-repository für tailscale eintragen
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }} {{ tailscale_repo_codename }} main
    filename: tailscale
    state: present
    update_cache: true

- name: paket tailscale installieren (oder aktualisieren)
  ansible.builtin.apt:
    name: tailscale
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: dienst tailscaled aktivieren und starten
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
    daemon_reload: true

- name: warten bis tailscaled bereit ist
  ansible.builtin.wait_for:
    path: /var/run/tailscale/tailscaled.sock
    state: present
    timeout: 30

- name: aktuellen verbindungsstatus von tailscale prüfen
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: tailscale-status auswerten
  ansible.builtin.set_fact:
    tailscale_connected: >-
      {{
        (tailscale_status_raw.stdout | from_json).BackendState == 'Running'
        if tailscale_status_raw.rc == 0 and tailscale_status_raw.stdout | length > 0
        else false
      }}

- name: aktuellen tailscale-zustand anzeigen
  ansible.builtin.debug:
    msg: "Tailscale connected: {{ tailscale_connected }}"

- name: bei tailscale mit auth-key anmelden
  when:
    - not tailscale_connected
    - not ansible_check_mode
  block:
    - name: temporäre datei für den auth-key anlegen
      ansible.builtin.tempfile:
        state: file
        suffix: tsauthkey
      register: tailscale_authkey_file

    - name: auth-key in die temporäre datei schreiben
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: "{{ tailscale_authkey_file.path }}"
        mode: '0600'
      no_log: true

    - name: mit tailscale verbinden und das lokale subnetz ankündigen
      ansible.builtin.command: >
        tailscale up
        --authkey=file:{{ tailscale_authkey_file.path }}
        --hostname={{ tailscale_hostname }}
        {{ ('--advertise-routes=' + tailscale_advertise_routes) if (tailscale_advertise_routes | default('') | length > 0) else '' }}
        --accept-dns=true
        --accept-routes={{ tailscale_accept_routes | bool | lower }}
        --timeout=60s
      register: tailscale_up_result
      changed_when: tailscale_up_result.rc == 0
      failed_when: tailscale_up_result.rc != 0
      no_log: true
  always:
    - name: temporäre auth-key-datei entfernen
      ansible.builtin.file:
        path: "{{ tailscale_authkey_file.path }}"
        state: absent
      when: tailscale_authkey_file.path | default('') != ''

- name: tailscale-optionen auffrischen (schon verbunden — hostname/routen aktualisieren)
  ansible.builtin.command: >
    tailscale set
    --hostname={{ tailscale_hostname }}
    {{ ('--advertise-routes=' + tailscale_advertise_routes) if (tailscale_advertise_routes | default('') | length > 0) else '' }}
    --accept-routes={{ tailscale_accept_routes | bool | lower }}
  register: tailscale_set_result
  changed_when: tailscale_set_result.rc == 0
  failed_when: false
  when: tailscale_connected

- name: abschließenden tailscale-status lesen
  ansible.builtin.command: tailscale status
  register: tailscale_final_status
  changed_when: false
  retries: 6
  delay: 5
  until: tailscale_final_status.rc == 0
  check_mode: false

- name: tailscale-ip-adresse lesen
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  failed_when: false
  check_mode: false

- name: tailscale-verbindungsdaten anzeigen
  ansible.builtin.debug:
    msg:
      - "Tailscale status: Connected"
      - "Tailscale IP: {{ tailscale_ip.stdout | default('unknown') }}"
      - "Hostname: {{ tailscale_hostname }}"
      - "Advertised subnet: {{ tailscale_advertise_routes if (tailscale_advertise_routes | default('') | length > 0) else 'none (reiner Tailnet-Client)' }}"
      - "NOTE: Approve the advertised subnet route in the admin panel (falls gesetzt):"
      - "      https://login.tailscale.com/admin/machines"
