---
- name: systemd nach dnsmasq-drop-in neu laden
  ansible.builtin.systemd:
    daemon_reload: true

- name: dnsmasq neu starten
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: systemd-resolved neu starten
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
