---

- name: dnsmasq installieren
  ansible.builtin.apt:
    name: dnsmasq
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: dnsmasq-konfiguration ablegen
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
  notify: dnsmasq neu starten

- name: automatischen neustart von dnsmasq bei fehlern einrichten (systemd-drop-in)
  block:
    - name: drop-in-verzeichnis anlegen
      ansible.builtin.file:
        path: /etc/systemd/system/dnsmasq.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: drop-in schreiben
      ansible.builtin.copy:
        dest: /etc/systemd/system/dnsmasq.service.d/10-restart.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (dnsmasq role).
          [Unit]
          StartLimitIntervalSec=0

          [Service]
          Restart=on-failure
          RestartSec=5
      notify: systemd nach dnsmasq-drop-in neu laden

- name: dns aus dem lokalen subnetz erlauben (ufw)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item }}"
    src: "{{ local_subnet }}"
  loop:
    - tcp
    - udp

- name: dns aus dem tailnet erlauben (ufw)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item }}"
    src: "100.64.0.0/10"
  loop:
    - tcp
    - udp

- name: dnsmasq aktivieren und starten
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started

- name: sicherstellen dass das drop-in-verzeichnis von systemd-resolved existiert
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: systemd-resolved auf dnsmasq (primär) und gateway (fallback) zeigen lassen
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (dnsmasq role).
      # Domains=~. routes ALL host lookups through dnsmasq so *.homeserver
      # resolves locally; dnsmasq itself forwards non-local names to the gateway.
      [Resolve]
      DNS={{ network_static_ip }}
      FallbackDNS={{ network_gateway }}
      Domains=~.
  notify: systemd-resolved neu starten

- name: sicherstellen dass /etc/resolv.conf der stub-symlink von systemd-resolved ist
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: ../run/systemd/resolve/stub-resolv.conf
    state: link
    force: true
  notify: systemd-resolved neu starten
