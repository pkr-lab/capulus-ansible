---

- name: Statische Fallback-Nameserver setzen (Netplan-Drop-in)
  when: worker_apt_update_dns_fallback_enabled | bool
  block:
    - name: Fallback-Nameserver-Konfiguration deployen
      ansible.builtin.template:
        src: dns-fallback.yaml.j2
        dest: /etc/netplan/90-dns-fallback.yaml
        owner: root
        group: root
        mode: '0600'
      notify: Netplan-Konfiguration anwenden

    - name: Handler sofort ausfuehren (DNS muss vor dem apt-Update unten stehen)
      ansible.builtin.meta: flush_handlers

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: worker_apt_update_enabled | bool

- name: Upgrade all packages to latest (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: worker_apt_update_enabled | bool

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: worker_apt_update_reboot_flag
  when: worker_apt_update_enabled | bool

- name: Neustart bei k3s-Servern nur nach etcd-Prüfung freigeben
  ansible.builtin.import_role:
    name: k3s_reboot_guard
  when:
    - worker_apt_update_enabled | bool
    - worker_apt_update_reboot_flag.stat.exists

- name: Reboot-erforderlich -- Node vor dem Neustart cordon/drain (auf dem primären Server)
  delegate_to: "{{ groups['k3s_primary'][0] }}"
  environment:
    KUBECONFIG: "{{ worker_apt_update_kubeconfig }}"
  when:
    - worker_apt_update_enabled | bool
    - worker_apt_update_reboot_flag.stat.exists
    - k3s_reboot_guard_ok | default(true) | bool
  block:
    - name: kubectl cordon {{ worker_apt_update_k3s_node_name }}
      ansible.builtin.command:
        cmd: kubectl cordon {{ worker_apt_update_k3s_node_name }}
      changed_when: true
      failed_when: false

    - name: kubectl drain {{ worker_apt_update_k3s_node_name }}
      ansible.builtin.command:
        cmd: >-
          kubectl drain {{ worker_apt_update_k3s_node_name }}
          --ignore-daemonsets --delete-emptydir-data --timeout=120s
      changed_when: true
      failed_when: false

- name: Reboot-erforderlich -- {{ inventory_hostname }} jetzt automatisch neu starten
  ansible.builtin.reboot:
    reboot_timeout: "{{ worker_apt_update_reboot_timeout_seconds }}"
    post_reboot_delay: "{{ worker_apt_update_post_reboot_delay_seconds }}"
  when:
    - worker_apt_update_enabled | bool
    - worker_apt_update_reboot_flag.stat.exists
    - k3s_reboot_guard_ok | default(true) | bool

- name: k3s-Server nach dem Neustart wieder Ready und schedulable machen
  when:
    - worker_apt_update_enabled | bool
    - worker_apt_update_reboot_flag.stat.exists
    - k3s_reboot_guard_ok | default(true) | bool
    - inventory_hostname in groups['k3s_servers'] | default([])
  delegate_to: "{{ groups['k3s_servers'] | difference([inventory_hostname]) | first }}"
  environment:
    KUBECONFIG: "{{ worker_apt_update_kubeconfig }}"
  block:
    - name: Prüfen ob der Node {{ worker_apt_update_k3s_node_name }} schon im Cluster registriert ist
      ansible.builtin.command: kubectl get node {{ worker_apt_update_k3s_node_name }} --no-headers
      register: worker_apt_update_server_node
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Node {{ worker_apt_update_k3s_node_name }} auf Ready warten
      ansible.builtin.command: >-
        kubectl get node {{ worker_apt_update_k3s_node_name }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: worker_apt_update_server_ready
      retries: 30
      delay: 10
      until: worker_apt_update_server_ready.stdout == 'True'
      changed_when: false
      when: worker_apt_update_server_node.rc == 0

    - name: kubectl uncordon {{ worker_apt_update_k3s_node_name }}
      ansible.builtin.command: kubectl uncordon {{ worker_apt_update_k3s_node_name }}
      changed_when: true
      when: worker_apt_update_server_node.rc == 0

- name: Reboot-erforderlich -- Abschluss melden (für den nightly_worker_wake-Bericht)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} wurde automatisch neu gestartet
      (reboot-required war gesetzt) und ist wieder erreichbar.
  when:
    - worker_apt_update_enabled | bool
    - worker_apt_update_reboot_flag.stat.exists
    - k3s_reboot_guard_ok | default(true) | bool
