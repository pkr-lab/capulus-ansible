---

- name: öffentlichen schlüssel von semaphore vom home-server holen
  ansible.builtin.slurp:
    src: "{{ semaphore_public_key_path }}"
  delegate_to: "{{ groups['k3s_primary'][0] }}"
  become: true
  register: semaphore_target_pubkey

- name: semaphore-schlüssel für {{ semaphore_authorize_user }} autorisieren
  ansible.posix.authorized_key:
    user: "{{ semaphore_authorize_user }}"
    state: present
    key: "{{ semaphore_target_pubkey.content | b64decode | trim }}"
    comment: "semaphore@homeserver"
