---

- name: restic-backup einrichten
  when: restic_backup_enabled | bool
  block:
    - name: pflichtwerte prüfen
      ansible.builtin.assert:
        that:
          - restic_backup_repository | length > 0
          - restic_backup_password | length > 0
        fail_msg: "restic_backup_repository und restic_backup_password (Vault) setzen"
      no_log: true

    - name: restic installieren
      ansible.builtin.apt:
        name: restic
        state: present

    - name: konfigurationsverzeichnis anlegen
      ansible.builtin.file:
        path: "{{ restic_backup_config_dir }}"
        state: directory
        owner: root
        group: "{{ restic_backup_user }}"
        mode: "0750"

    - name: repository-passwort ablegen
      ansible.builtin.copy:
        content: "{{ restic_backup_password }}"
        dest: "{{ restic_backup_config_dir }}/password"
        owner: "{{ restic_backup_user }}"
        group: "{{ restic_backup_user }}"
        mode: "0400"
      no_log: true

    - name: umgebung und ausschlussliste ablegen
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ restic_backup_config_dir }}/{{ item.dest }}"
        owner: root
        group: "{{ restic_backup_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: env.j2, dest: env, mode: "0640" }
        - { src: excludes.j2, dest: excludes, mode: "0644" }

    - name: systemd-units und timer deployen
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - restic-backup.service
        - restic-backup.timer
        - restic-prune.service
        - restic-prune.timer

    - name: repository prüfen
      ansible.builtin.command: restic cat config
      environment:
        RESTIC_REPOSITORY: "{{ restic_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ restic_backup_config_dir }}/password"
      become: true
      become_user: "{{ restic_backup_user }}"
      register: restic_backup_repo_check
      changed_when: false
      failed_when:
        - restic_backup_repo_check.rc != 0
        - not restic_backup_repo_missing | bool
      check_mode: false
      vars:
        restic_backup_repo_missing: >-
          {{ restic_backup_repo_check.rc == 10
             or 'does not exist' in restic_backup_repo_check.stderr
             or 'Is there a repository at the following location' in restic_backup_repo_check.stderr }}

    - name: repository initialisieren
      ansible.builtin.command: restic init
      environment:
        RESTIC_REPOSITORY: "{{ restic_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ restic_backup_config_dir }}/password"
      become: true
      become_user: "{{ restic_backup_user }}"
      changed_when: true
      when:
        - restic_backup_repo_check.rc != 0
        - not ansible_check_mode

    - name: timer aktivieren und starten
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - restic-backup.timer
        - restic-prune.timer
      when: not ansible_check_mode
