---

- name: nfs-common und rsync installieren
  ansible.builtin.apt:
    name:
      - nfs-common
      - rsync
    state: present
    update_cache: true

- name: nfs-freigabe für die etcd-snapshots einbinden
  ansible.posix.mount:
    src: "{{ k3s_snapshot_nfs_server }}:{{ k3s_snapshot_nfs_export }}"
    path: "{{ k3s_snapshot_mount_point }}"
    fstype: nfs
    opts: nofail,_netdev,x-systemd.mount-timeout=30
    state: mounted

- name: kopier-skript für etcd-snapshots ablegen
  ansible.builtin.copy:
    src: k3s-etcd-snapshot-copy.sh
    dest: /usr/local/bin/k3s-etcd-snapshot-copy.sh
    owner: root
    group: root
    mode: '0755'

- name: systemd-service und timer für die snapshot-kopie ablegen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - k3s-etcd-snapshot-copy.service
    - k3s-etcd-snapshot-copy.timer

- name: snapshot-timer aktivieren und starten
  ansible.builtin.systemd:
    name: k3s-etcd-snapshot-copy.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
