---

- name: k3s-version für die server festschreiben prüfen
  ansible.builtin.assert:
    that:
      - k3s_version | length > 0
    fail_msg: >-
      Im Modus {{ k3s_mode }} muss k3s_version gesetzt sein (alle Server brauchen dieselbe Version).
  when: k3s_mode in ['init', 'join']

- name: prüfen dass kein k3s-agent mehr installiert ist
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_unit
  when: k3s_mode == 'join'

- name: abbrechen wenn der k3s-agent noch installiert ist
  ansible.builtin.fail:
    msg: >-
      Auf {{ inventory_hostname }} ist noch der k3s-agent installiert. Vor dem Beitritt als Server
      /usr/local/bin/k3s-agent-uninstall.sh ausführen und den Node mit kubectl delete node entfernen.
  when:
    - k3s_mode == 'join'
    - k3s_agent_unit.stat.exists

- name: voraussetzungen für k3s auf dem server herstellen
  ansible.builtin.import_role:
    name: k3s_agent
    tasks_from: prerequisites.yml
  when: k3s_mode == 'join'

- name: firewall-regeln für die k3s-server anlegen
  ansible.builtin.import_tasks: ufw.yml
  when:
    - k3s_mode in ['init', 'join']
    - k3s_ufw_enable | bool

- name: host-firewall für k3s konfigurieren
  ansible.builtin.import_role:
    name: k3s_agent
    tasks_from: ufw.yml
  when:
    - k3s_mode == 'join'
    - k3s_agent_ufw_enable | default(false) | bool

- name: join-token vom primären server lesen
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  delegate_to: "{{ k3s_primary_host }}"
  register: k3s_join_token_raw
  no_log: true
  when: k3s_mode == 'join'

- name: join-token als fakt setzen
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_join_token_raw.content | b64decode | trim }}"
  no_log: true
  when: k3s_mode == 'join'

- name: verzeichnis /etc/rancher/k3s anlegen
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: audit-policy für kube-apiserver templaten
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    owner: root
    group: root
    mode: '0644'
  when: k3s_audit_log_enabled | bool

- name: verzeichnis /var/log/k3s für das audit-log anlegen
  ansible.builtin.file:
    path: /var/log/k3s
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: k3s_audit_log_enabled | bool

- name: eigene resolv.conf für kubelet und coredns schreiben
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for ns in k3s_resolv_nameservers %}
      nameserver {{ ns }}
      {% endfor %}
      {% if k3s_resolv_search | length > 0 %}
      search {{ k3s_resolv_search | join(' ') }}
      {% endif %}
  when: k3s_resolv_nameservers | length > 0

- name: k3s-server-konfiguration templaten
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "{{ '0600' if k3s_mode == 'join' else '0644' }}"
  no_log: "{{ k3s_mode == 'join' }}"

- name: prüfen ob k3s bereits installiert ist
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: aktuelle k3s-version lesen (falls installiert)
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_binary.stat.exists

- name: entscheiden ob der k3s-installer (erneut) laufen muss
  ansible.builtin.set_fact:
    k3s_run_installer: >-
      {{
        (not k3s_binary.stat.exists)
        or (k3s_version | length > 0 and k3s_version not in (k3s_current_version.stdout | default('')))
        or (k3s_version | length == 0 and auto_upgrade | bool)
      }}

- name: k3s-installationsskript herunterladen
  ansible.builtin.get_url:
    url: "{{ k3s_installer_url }}"
    checksum: "sha256:{{ k3s_installer_sha256 }}"
    dest: /tmp/get-k3s.sh
    mode: '0755'
    force: true
  when: k3s_run_installer

- name: k3s installieren oder aktualisieren (gepinnte version oder neueste im kanal)
  ansible.builtin.command: /tmp/get-k3s.sh server
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel | default('stable') }}"
  register: k3s_install
  retries: 3
  delay: 10
  until: k3s_install.rc == 0
  changed_when:
    - k3s_install.rc == 0
    - "'Skipping' not in (k3s_install.stdout | default(''))"
  when: k3s_run_installer

- name: k3s-installationsskript entfernen
  ansible.builtin.file:
    path: /tmp/get-k3s.sh
    state: absent

- name: dienst k3s aktivieren und starten
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: warten bis der k3s-api-server erreichbar ist (port 6443)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    state: started
    delay: 5
    timeout: 120

- name: warten bis der k3s-node ready ist
  ansible.builtin.command: kubectl get node {{ k3s_node_name }} --no-headers
  register: k3s_nodes_status
  retries: 30
  delay: 10
  until: k3s_nodes_status.rc == 0 and ' Ready' in k3s_nodes_status.stdout and 'NotReady' not in k3s_nodes_status.stdout
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false

- name: node-status anzeigen
  ansible.builtin.debug:
    var: k3s_nodes_status.stdout_lines

- name: etcd-gesundheit der api prüfen
  ansible.builtin.command: kubectl get --raw=/readyz/etcd
  register: k3s_etcd_ready
  retries: 12
  delay: 10
  until: k3s_etcd_ready.rc == 0 and k3s_etcd_ready.stdout == 'ok'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false
  when: k3s_mode == 'join'

- name: etcd-mitglieder zählen
  ansible.builtin.command: kubectl get nodes -l node-role.kubernetes.io/etcd -o name
  register: k3s_etcd_members
  retries: 12
  delay: 10
  until: k3s_etcd_members.stdout_lines | length >= k3s_etcd_min_members | int
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false
  when: k3s_mode == 'join'

- name: etcd-mitglieder anzeigen
  ansible.builtin.debug:
    var: k3s_etcd_members.stdout_lines
  when: k3s_mode == 'join'

- name: kopie der etcd-snapshots auf die nas einrichten
  ansible.builtin.import_tasks: snapshots.yml
  when:
    - k3s_mode in ['init', 'join']
    - k3s_snapshot_copy_enabled | bool

- name: verzeichnis .kube für den benutzer ubuntu anlegen
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: k3s-kubeconfig für den benutzer ubuntu kopieren
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: KUBECONFIG in /etc/environment setzen (systemweit)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^KUBECONFIG='
    line: 'KUBECONFIG=/home/{{ ansible_user }}/.kube/config'
    state: present

- name: KUBECONFIG in der .bashrc des benutzers ubuntu setzen
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    regexp: '^export KUBECONFIG='
    line: 'export KUBECONFIG=/home/{{ ansible_user }}/.kube/config'
    state: present
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: kubectl-vervollständigung und alias `k` in der .bashrc des benutzers ubuntu eintragen
  ansible.builtin.blockinfile:
    path: /home/{{ ansible_user }}/.bashrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK — kubectl"
    block: |
      # kubectl shell completion
      if command -v kubectl &>/dev/null; then
        source <(kubectl completion bash)
        alias k=kubectl
        complete -o default -F __start_kubectl k
      fi
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: prüfen ob helm bereits installiert ist
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: k3s_helm_binary

- name: installierte helm-version lesen
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: k3s_helm_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_helm_binary.stat.exists

- name: entscheiden ob helm (erneut) installiert werden muss
  ansible.builtin.set_fact:
    k3s_install_helm: >-
      {{
        (not k3s_helm_binary.stat.exists)
        or (k3s_helm_release not in (k3s_helm_installed.stdout | default('')))
      }}

- name: helm-release herunterladen
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ k3s_helm_release }}-linux-{{ k3s_helm_arch }}.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ k3s_helm_release }}-linux-{{ k3s_helm_arch }}.tar.gz.sha256sum"
    dest: /tmp/helm.tar.gz
    mode: '0644'
  when: k3s_install_helm

- name: helm-binary installieren
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - "linux-{{ k3s_helm_arch }}/helm"
    extra_opts:
      - --strip-components=1
  when:
    - k3s_install_helm
    - not ansible_check_mode

- name: rechte des helm-binarys setzen
  ansible.builtin.file:
    path: /usr/local/bin/helm
    owner: root
    group: root
    mode: '0755'
  when:
    - k3s_install_helm
    - not ansible_check_mode

- name: helm-archiv entfernen
  ansible.builtin.file:
    path: /tmp/helm.tar.gz
    state: absent

- name: helm-installation prüfen
  ansible.builtin.command: helm version --short
  register: k3s_helm_version
  changed_when: false
  check_mode: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: helm-version anzeigen
  ansible.builtin.debug:
    msg: "Helm installed: {{ k3s_helm_version.stdout }}"

- name: warten bis die system-pods bereit sind
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods
    --all
    -n kube-system
    --timeout=300s
    --field-selector=status.phase!=Succeeded
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_core_pods_ready
  changed_when: false
  failed_when:
    - k3s_core_pods_ready.rc != 0
    - "'no matching resources' not in k3s_core_pods_ready.stderr"

- name: status der system-pods lesen
  ansible.builtin.command: kubectl get pods -n kube-system --no-headers
  register: k3s_system_pods
  changed_when: false
  check_mode: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: status der system-pods anzeigen
  ansible.builtin.debug:
    var: k3s_system_pods.stdout_lines
