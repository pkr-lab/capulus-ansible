---

- name: k3s-Version für die Server festschreiben prüfen
  ansible.builtin.assert:
    that:
      - k3s_version | length > 0
    fail_msg: >-
      Im Modus {{ k3s_mode }} muss k3s_version gesetzt sein (alle Server brauchen dieselbe Version).
  when: k3s_mode in ['init', 'join']

- name: Prüfen dass kein k3s-agent mehr installiert ist
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_unit
  when: k3s_mode == 'join'

- name: Abbrechen wenn der k3s-agent noch installiert ist
  ansible.builtin.fail:
    msg: >-
      Auf {{ inventory_hostname }} ist noch der k3s-agent installiert. Vor dem Beitritt als Server
      /usr/local/bin/k3s-agent-uninstall.sh ausführen und den Node mit kubectl delete node entfernen.
  when:
    - k3s_mode == 'join'
    - k3s_agent_unit.stat.exists

- name: Voraussetzungen für k3s auf dem Server herstellen
  ansible.builtin.import_role:
    name: k3s_agent
    tasks_from: prerequisites.yml
  when: k3s_mode == 'join'

- name: Firewall-Regeln für die k3s-Server anlegen
  ansible.builtin.import_tasks: ufw.yml
  when:
    - k3s_mode in ['init', 'join']
    - k3s_ufw_enable | bool

- name: Host-Firewall für k3s konfigurieren
  ansible.builtin.import_role:
    name: k3s_agent
    tasks_from: ufw.yml
  when:
    - k3s_mode == 'join'
    - k3s_agent_ufw_enable | default(false) | bool

- name: Join-Token vom primären Server lesen
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  delegate_to: "{{ k3s_primary_host }}"
  register: k3s_join_token_raw
  no_log: true
  when: k3s_mode == 'join'

- name: Join-Token als Fakt setzen
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_join_token_raw.content | b64decode | trim }}"
  no_log: true
  when: k3s_mode == 'join'

- name: Create /etc/rancher/k3s directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Template kube-apiserver audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    owner: root
    group: root
    mode: '0644'
  when: k3s_audit_log_enabled | bool

- name: Create /var/log/k3s directory for audit log output
  ansible.builtin.file:
    path: /var/log/k3s
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: k3s_audit_log_enabled | bool

- name: Eigene resolv.conf für kubelet und CoreDNS schreiben
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for ns in k3s_resolv_nameservers %}
      nameserver {{ ns }}
      {% endfor %}
  when: k3s_resolv_nameservers | length > 0

- name: Template k3s server configuration
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "{{ '0600' if k3s_mode == 'join' else '0644' }}"
  no_log: "{{ k3s_mode == 'join' }}"

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get current k3s version (if installed)
  ansible.builtin.command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_binary.stat.exists

- name: Decide whether to (re)run the k3s installer
  ansible.builtin.set_fact:
    k3s_run_installer: >-
      {{
        (not k3s_binary.stat.exists)
        or (k3s_version | length > 0 and k3s_version not in (k3s_current_version.stdout | default('')))
        or (k3s_version | length == 0 and auto_upgrade | bool)
      }}

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_installer_url }}"
    checksum: "sha256:{{ k3s_installer_sha256 }}"
    dest: /tmp/get-k3s.sh
    mode: '0755'
    force: true
  when: k3s_run_installer

- name: Install or upgrade k3s (pinned version or latest in channel)
  ansible.builtin.command: /tmp/get-k3s.sh server
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel | default('stable') }}"
  register: k3s_install
  retries: 3
  delay: 10
  until: k3s_install.rc == 0
  changed_when:
    - k3s_install.rc == 0
    - "'Skipping' not in (k3s_install.stdout | default(''))"
  when: k3s_run_installer

- name: Remove k3s install script
  ansible.builtin.file:
    path: /tmp/get-k3s.sh
    state: absent

- name: Enable and start k3s service
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for k3s API server to be reachable (port 6443)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    state: started
    delay: 5
    timeout: 120

- name: Wait for k3s node to be in Ready state
  ansible.builtin.command: kubectl get node {{ k3s_node_name }} --no-headers
  register: k3s_nodes_status
  retries: 30
  delay: 10
  until: k3s_nodes_status.rc == 0 and ' Ready' in k3s_nodes_status.stdout and 'NotReady' not in k3s_nodes_status.stdout
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false

- name: Display node status
  ansible.builtin.debug:
    var: k3s_nodes_status.stdout_lines

- name: etcd-Gesundheit der API prüfen
  ansible.builtin.command: kubectl get --raw=/readyz/etcd
  register: k3s_etcd_ready
  retries: 12
  delay: 10
  until: k3s_etcd_ready.rc == 0 and k3s_etcd_ready.stdout == 'ok'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false
  when: k3s_mode == 'join'

- name: etcd-Mitglieder zählen
  ansible.builtin.command: kubectl get nodes -l node-role.kubernetes.io/etcd -o name
  register: k3s_etcd_members
  retries: 12
  delay: 10
  until: k3s_etcd_members.stdout_lines | length >= k3s_etcd_min_members | int
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false
  when: k3s_mode == 'join'

- name: etcd-Mitglieder anzeigen
  ansible.builtin.debug:
    var: k3s_etcd_members.stdout_lines
  when: k3s_mode == 'join'

- name: etcd-Snapshots auf die NAS kopieren einrichten
  ansible.builtin.import_tasks: snapshots.yml
  when:
    - k3s_mode in ['init', 'join']
    - k3s_snapshot_copy_enabled | bool

- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Copy k3s kubeconfig to ubuntu user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Set KUBECONFIG in /etc/environment (system-wide)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^KUBECONFIG='
    line: 'KUBECONFIG=/home/{{ ansible_user }}/.kube/config'
    state: present

- name: Set KUBECONFIG in ubuntu user's .bashrc
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    regexp: '^export KUBECONFIG='
    line: 'export KUBECONFIG=/home/{{ ansible_user }}/.kube/config'
    state: present
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Add kubectl completion and `k` alias to ubuntu user's .bashrc
  ansible.builtin.blockinfile:
    path: /home/{{ ansible_user }}/.bashrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK — kubectl"
    block: |
      # kubectl shell completion
      if command -v kubectl &>/dev/null; then
        source <(kubectl completion bash)
        alias k=kubectl
        complete -o default -F __start_kubectl k
      fi
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Check if Helm is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: k3s_helm_binary

- name: Get installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: k3s_helm_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_helm_binary.stat.exists

- name: Decide whether to (re)install Helm
  ansible.builtin.set_fact:
    k3s_install_helm: >-
      {{
        (not k3s_helm_binary.stat.exists)
        or (k3s_helm_release not in (k3s_helm_installed.stdout | default('')))
      }}

- name: Download Helm release
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ k3s_helm_release }}-linux-{{ k3s_helm_arch }}.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ k3s_helm_release }}-linux-{{ k3s_helm_arch }}.tar.gz.sha256sum"
    dest: /tmp/helm.tar.gz
    mode: '0644'
  when: k3s_install_helm

- name: Install Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - "linux-{{ k3s_helm_arch }}/helm"
    extra_opts:
      - --strip-components=1
  when:
    - k3s_install_helm
    - not ansible_check_mode

- name: Set Helm binary permissions
  ansible.builtin.file:
    path: /usr/local/bin/helm
    owner: root
    group: root
    mode: '0755'
  when:
    - k3s_install_helm
    - not ansible_check_mode

- name: Remove Helm archive
  ansible.builtin.file:
    path: /tmp/helm.tar.gz
    state: absent

- name: Verify Helm installation
  ansible.builtin.command: helm version --short
  register: k3s_helm_version
  changed_when: false
  check_mode: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Display Helm version
  ansible.builtin.debug:
    msg: "Helm installed: {{ k3s_helm_version.stdout }}"

- name: Wait for core system pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods
    --all
    -n kube-system
    --timeout=300s
    --field-selector=status.phase!=Succeeded
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_core_pods_ready
  changed_when: false
  failed_when: false

- name: Get system pod status
  ansible.builtin.command: kubectl get pods -n kube-system --no-headers
  register: k3s_system_pods
  changed_when: false
  check_mode: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Show system pod status
  ansible.builtin.debug:
    var: k3s_system_pods.stdout_lines
