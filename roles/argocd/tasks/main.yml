---

- name: argocd-namespace anlegen (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml |
        kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_ns_apply
  changed_when: "'created' in argocd_ns_apply.stdout"

- name: argo-helm-repository hinzufügen
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  register: argocd_helm_repo_add
  changed_when: '"has been added" in argocd_helm_repo_add.stdout'
  failed_when:
    - argocd_helm_repo_add.rc != 0
    - "'already exists' not in argocd_helm_repo_add.stderr"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: helm-repositories aktualisieren
  ansible.builtin.command: helm repo update
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: helm-werte für argocd nach /tmp templaten
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /tmp/argocd-values.yaml
    owner: root
    group: root
    mode: '0644'

- name: tls-secret für den ingress anlegen
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      d=$(mktemp -d)
      trap 'rm -rf "$d"' EXIT
      printf '%s\n' "$TLS_CRT" > "$d/tls.crt"
      printf '%s\n' "$TLS_KEY" > "$d/tls.key"
      kubectl -n {{ argocd_namespace }} create secret tls argocd-server-tls \
        --cert="$d/tls.crt" --key="$d/tls.key" --dry-run=client -o yaml |
        kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    TLS_CRT: "{{ argocd_ingress_tls_crt }}"
    TLS_KEY: "{{ argocd_ingress_tls_key }}"
  register: argocd_tls_secret_apply
  changed_when: "'created' in argocd_tls_secret_apply.stdout or 'configured' in argocd_tls_secret_apply.stdout"
  no_log: true
  when: argocd_ingress_tls_crt | length > 0

- name: argocd per helm installieren oder aktualisieren
  ansible.builtin.command: >
    helm upgrade --install argocd argo/argo-cd
    {% if argocd_version | length > 0 %}--version {{ argocd_version }}{% endif %}
    --namespace {{ argocd_namespace }}
    --values /tmp/argocd-values.yaml
    --atomic
    --timeout 20m
    --create-namespace
  register: argocd_helm_result
  changed_when: "'deployed' in argocd_helm_result.stdout or 'upgraded' in argocd_helm_result.stdout"
  retries: 2
  delay: 30
  until: argocd_helm_result.rc == 0
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: status des helm-releases anzeigen
  ansible.builtin.debug:
    var: argocd_helm_result.stdout_lines

- name: warten bis das argocd-server-deployment verfügbar ist
  ansible.builtin.command: >
    kubectl rollout status deployment/argocd-server
    --namespace {{ argocd_namespace }}
    --timeout=5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_rollout
  changed_when: false

- name: warten bis alle argocd-pods bereit sind
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods
    --all
    --namespace {{ argocd_namespace }}
    --timeout=300s
    --field-selector=status.phase!=Succeeded
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_pods_ready
  changed_when: false

- name: prüfen ob das initiale admin-secret existiert
  ansible.builtin.command: >
    kubectl get secret argocd-initial-admin-secret
    --namespace {{ argocd_namespace }}
    --ignore-not-found
    -o name
  register: argocd_secret_check
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: initiales argocd-admin-passwort lesen
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret \
        -o jsonpath="{.data.password}" | base64 -d
    executable: /bin/bash
  register: argocd_initial_password
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: argocd_secret_check.stdout | length > 0

- name: initiale argocd-zugangsdaten anzeigen (passwort verborgen)
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "ArgoCD Initial Credentials"
      - "=================================================="
      - "URL:      {{ ('https://' ~ argocd_ui_host) if (argocd_ingress_enabled | bool) else ('http://' ~ ansible_default_ipv4.address ~ ':30080') }}"
      - "CLI/CI:   {{ ('https://' ~ argocd_ui_host ~ ' (argocd login ' ~ argocd_ui_host ~ ' --grpc-web)') if (argocd_ingress_enabled | bool) else ('http://' ~ ansible_default_ipv4.address ~ ':30080 (argocd login ... --plaintext)') }}"
      - "Username: admin"
      - "Password: retrieve with —"
      - "  kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d; echo"
      - "  (re-run with -e argocd_show_initial_password=true to print it here)"
      - "=================================================="
      - "IMPORTANT: Change this password after first login!"
      - "=================================================="
  when: not (argocd_show_initial_password | bool)

- name: initiale argocd-zugangsdaten anzeigen (passwort sichtbar)
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "ArgoCD Initial Credentials"
      - "=================================================="
      - "URL:      {{ ('https://' ~ argocd_ui_host) if (argocd_ingress_enabled | bool) else ('http://' ~ ansible_default_ipv4.address ~ ':30080') }}"
      - "CLI/CI:   {{ ('https://' ~ argocd_ui_host ~ ' (argocd login ' ~ argocd_ui_host ~ ' --grpc-web)') if (argocd_ingress_enabled | bool) else ('http://' ~ ansible_default_ipv4.address ~ ':30080 (argocd login ... --plaintext)') }}"
      - "Username: admin"
      - "Password: {{ argocd_initial_password.stdout | default('secret already deleted or changed') }}"
      - "=================================================="
      - "IMPORTANT: Change this password after first login!"
      - "=================================================="
  when: argocd_show_initial_password | bool

- name: bootstrap-appprojects templaten
  ansible.builtin.template:
    src: bootstrap-appprojects.yaml.j2
    dest: /tmp/argocd-bootstrap-appprojects.yaml
    owner: root
    group: root
    mode: '0644'

- name: bootstrap-appprojects anwenden
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-bootstrap-appprojects.yaml
  register: argocd_appprojects_apply
  changed_when: "'created' in argocd_appprojects_apply.stdout or 'configured' in argocd_appprojects_apply.stdout"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: alte applicationsets platform/workloads entfernen (entw-layout)
  ansible.builtin.command: >
    kubectl delete applicationset
    home-server-apps-platform home-server-apps-workloads
    --namespace {{ argocd_namespace }}
    --ignore-not-found
  register: argocd_legacy_appset_delete
  changed_when: "'deleted' in argocd_legacy_appset_delete.stdout"
  when: argocd_entw_layout | bool
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: bootstrap-applicationset templaten
  ansible.builtin.template:
    src: bootstrap-applicationset.yaml.j2
    dest: /tmp/argocd-bootstrap-applicationset.yaml
    owner: root
    group: root
    mode: '0644'

- name: bootstrap-applicationset anwenden
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-bootstrap-applicationset.yaml
  register: argocd_appset_apply
  changed_when: "'created' in argocd_appset_apply.stdout or 'configured' in argocd_appset_apply.stdout"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: alte appprojects platform/workloads entfernen (entw-layout)
  ansible.builtin.command: >
    kubectl delete appproject platform workloads
    --namespace {{ argocd_namespace }}
    --ignore-not-found
  register: argocd_legacy_project_delete
  changed_when: "'deleted' in argocd_legacy_project_delete.stdout"
  failed_when:
    - argocd_legacy_project_delete.rc != 0
    - "'have a resource type' not in argocd_legacy_project_delete.stderr"
  when: argocd_entw_layout | bool
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: status der applicationsets anzeigen
  ansible.builtin.debug:
    var: argocd_appset_apply.stdout

- name: warten bis die applicationsets verarbeitet sind
  ansible.builtin.command: >
    kubectl get applicationsets home-server-apps-{{ item }}
    --namespace {{ argocd_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="ErrorOccurred")].status}'
  loop: "{{ ['entw'] if argocd_entw_layout | bool else ['tech'] }}"
  register: argocd_appset_status
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  until:
    - argocd_appset_status.rc == 0
    - argocd_appset_status.stdout != 'True'
  retries: 5
  delay: 10

- name: angelegte applications auflisten
  ansible.builtin.command: >
    kubectl get applications
    --namespace {{ argocd_namespace }}
    --no-headers
  register: argocd_apps_list
  changed_when: false
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: applications anzeigen
  ansible.builtin.debug:
    msg: "{{ argocd_apps_list.stdout_lines | default(['No applications found yet — ArgoCD is polling Git']) }}"

- name: namespaces der platform-stufe mit security-tier=platform labeln
  ansible.builtin.command: >
    kubectl label namespace {{ item }} security-tier=platform --overwrite
  loop: "{{ argocd_platform_apps }}"
  register: argocd_platform_label
  changed_when: "'labeled' in argocd_platform_label.stdout"
  failed_when:
    - argocd_platform_label.rc != 0
    - "'not found' not in argocd_platform_label.stderr"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: namespaces der workloads-stufe mit security-tier=workload labeln
  ansible.builtin.command: >
    kubectl label namespace {{ item }} security-tier=workload --overwrite
  loop: "{{ argocd_workloads_apps }}"
  register: argocd_workloads_label
  changed_when: "'labeled' in argocd_workloads_label.stdout"
  failed_when:
    - argocd_workloads_label.rc != 0
    - "'not found' not in argocd_workloads_label.stderr"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: vorhandene namespaces lesen
  ansible.builtin.command: >
    kubectl get namespaces -o jsonpath={.items[*].metadata.name}
  register: argocd_existing_namespaces_raw
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: argocd_apply_network_policies | bool

- name: vorhandene namespaces als fakt setzen
  ansible.builtin.set_fact:
    argocd_existing_namespaces: "{{ argocd_existing_namespaces_raw.stdout.split() }}"
  when: argocd_apply_network_policies | bool

- name: networkpolicies tier-default-ingress templaten
  ansible.builtin.template:
    src: bootstrap-networkpolicies.yaml.j2
    dest: /tmp/argocd-bootstrap-networkpolicies.yaml
    owner: root
    group: root
    mode: '0644'
  when: argocd_apply_network_policies | bool

- name: networkpolicies tier-default-ingress anwenden
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-bootstrap-networkpolicies.yaml
  register: argocd_netpol_apply
  changed_when: "'created' in argocd_netpol_apply.stdout or 'configured' in argocd_netpol_apply.stdout"
  when:
    - argocd_apply_network_policies | bool
    - (argocd_platform_apps + argocd_workloads_apps)
      | intersect(argocd_existing_namespaces)
      | difference(argocd_network_policy_excluded_apps)
      | length > 0
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: temporäre helm-wertedatei entfernen
  ansible.builtin.file:
    path: /tmp/argocd-values.yaml
    state: absent
