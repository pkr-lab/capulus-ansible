---

- name: voraussetzungen für k3s auf dem node herstellen
  ansible.builtin.import_tasks: prerequisites.yml

- name: host-firewall für k3s konfigurieren
  ansible.builtin.import_tasks: ufw.yml
  when: k3s_agent_ufw_enable | bool

- name: node-token von k3s vom server lesen
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  delegate_to: "{{ k3s_server_host }}"
  register: k3s_agent_token_raw

- name: node-token von k3s als fakt setzen
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_agent_token_raw.content | b64decode | trim }}"

- name: verzeichnis /etc/rancher/k3s anlegen
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: k3s-agent-konfiguration templaten
  ansible.builtin.template:
    src: k3s-agent-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
  notify: k3s-agent neu starten

- name: prüfen ob k3s bereits installiert ist
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: aktuelle k3s-version lesen (falls installiert)
  ansible.builtin.command: k3s --version
  register: k3s_agent_current_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_agent_binary.stat.exists

- name: entscheiden ob der k3s-installer (erneut) laufen muss
  ansible.builtin.set_fact:
    k3s_agent_run_installer: >-
      {{
        (not k3s_agent_binary.stat.exists)
        or (k3s_version | length > 0 and k3s_version not in (k3s_agent_current_version.stdout | default('')))
        or (k3s_version | length == 0 and auto_upgrade | bool)
      }}

- name: k3s-installationsskript herunterladen
  ansible.builtin.get_url:
    url: "{{ k3s_installer_url }}"
    checksum: "sha256:{{ k3s_installer_sha256 }}"
    dest: /tmp/get-k3s.sh
    mode: '0755'
    force: true
  when: k3s_agent_run_installer

- name: k3s-agent installieren oder aktualisieren
  ansible.builtin.command: /tmp/get-k3s.sh agent
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel | default('stable') }}"
  register: k3s_agent_install_result
  retries: 3
  delay: 10
  until: k3s_agent_install_result.rc == 0
  changed_when:
    - k3s_agent_install_result.rc == 0
    - "'Skipping' not in (k3s_agent_install_result.stdout | default(''))"
  when: k3s_agent_run_installer

- name: k3s-installationsskript entfernen
  ansible.builtin.file:
    path: /tmp/get-k3s.sh
    state: absent

- name: dienst k3s-agent aktivieren und starten
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
    daemon_reload: true

- name: warten bis der node {{ k3s_agent_hostname }} ready ist
  ansible.builtin.command: kubectl get node {{ k3s_agent_hostname }} --no-headers
  register: k3s_agent_node_status
  retries: 30
  delay: 10
  until: >-
    k3s_agent_node_status.rc == 0
    and 'Ready' in k3s_agent_node_status.stdout
    and 'NotReady' not in k3s_agent_node_status.stdout
  delegate_to: "{{ k3s_server_host }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false

- name: node-status des clusters lesen
  ansible.builtin.command: kubectl get nodes -o wide
  register: k3s_agent_all_nodes
  delegate_to: "{{ k3s_server_host }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  check_mode: false

- name: alle nodes des clusters anzeigen
  ansible.builtin.debug:
    var: k3s_agent_all_nodes.stdout_lines
