---

- name: nfs-common installieren
  ansible.builtin.apt:
    name: nfs-common
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ k3s_agent_hostname }}"
    use: systemd

- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ k3s_agent_hostname }}"
    state: present

- name: kubernetes-voraussetzungen aus der rolle common übernehmen
  ansible.builtin.import_role:
    name: common
    tasks_from: k8s_prerequisites.yml
