---
- name: systemd für xibo-kiosk neu laden
  ansible.builtin.systemd:
    daemon_reload: true

- name: sync-timer von xibosignage neu starten
  ansible.builtin.systemd:
    name: xibosignage-sync.timer
    daemon_reload: true
    state: restarted

- name: hinweis auf nötigen reboot nach edid-erzwingung
  ansible.builtin.debug:
    msg: >-
      cmdline.txt wurde fuer die erzwungene EDID geaendert; ein Reboot des
      Geraets ist noetig, damit der Kernel-Parameter wirkt.
