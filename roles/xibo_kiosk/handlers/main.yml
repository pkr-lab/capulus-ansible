---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart xibosignage sync timer
  ansible.builtin.systemd:
    name: xibosignage-sync.timer
    daemon_reload: true
    state: restarted

- name: Hinweis auf noetigen Reboot nach EDID-Erzwingung
  ansible.builtin.debug:
    msg: >-
      cmdline.txt wurde fuer die erzwungene EDID geaendert; ein Reboot des
      Geraets ist noetig, damit der Kernel-Parameter wirkt.
