---

- name: Pakete für NFS-Mount, Sync und Kiosk installieren
  ansible.builtin.apt:
    name:
      - nfs-common
      - chromium
      - chromium-browser
      - unclutter
      - x11-xserver-utils
      - xserver-xorg
      - xinit
      - xauth
      - openbox
      - imagemagick
      - python3
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: xibo_kiosk_enabled | bool

- name: Startmodus prüfen
  ansible.builtin.assert:
    that:
      - xibo_kiosk_start_mode in ['systemd', 'getty']
    fail_msg: "xibo_kiosk_start_mode muss systemd oder getty sein"
  when: xibo_kiosk_enabled | bool

- name: Alte Webserver- und Manifest-Units entfernen
  when: xibo_kiosk_enabled | bool
  block:
    - name: Alte Units stoppen und deaktivieren
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - xibosignage-webserver.service
        - xibosignage-manifest.timer
        - xibosignage-manifest.service
      failed_when: false

    - name: Alte Unit-Dateien und Skripte löschen
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/xibosignage-webserver.service
        - /etc/systemd/system/xibosignage-manifest.timer
        - /etc/systemd/system/xibosignage-manifest.service
        - /usr/local/bin/xibosignage-manifest.sh
        - "{{ xibo_kiosk_web_root }}/manifest.json"
      notify: Reload systemd

- name: xibosignage-display ggf. aushängen
  ansible.posix.mount:
    path: "{{ xibo_kiosk_mount_point }}"
    state: unmounted
  when: xibo_kiosk_enabled | bool
  failed_when: false

- name: Mount-Point für xibosignage-display anlegen
  ansible.builtin.file:
    path: "{{ xibo_kiosk_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xibo_kiosk_enabled | bool

- name: xibosignage-display in fstab eintragen (read-only, noauto, wird vom Sync gemountet)
  ansible.posix.mount:
    path: "{{ xibo_kiosk_mount_point }}"
    src: "{{ xibo_kiosk_nfs_server }}:{{ xibo_kiosk_nfs_path }}"
    fstype: nfs
    opts: "ro,soft,timeo=30,retrans=2,noauto,nofail,_netdev"
    state: present
  when: xibo_kiosk_enabled | bool
  notify: Reload systemd

- name: Webroot für Slideshow anlegen
  ansible.builtin.file:
    path: "{{ xibo_kiosk_web_root }}"
    state: directory
    owner: "{{ xibo_kiosk_user }}"
    group: "{{ xibo_kiosk_user }}"
    mode: "0755"
  when: xibo_kiosk_enabled | bool

- name: Alten media-Symlink auf den NFS-Mount prüfen
  ansible.builtin.stat:
    path: "{{ xibo_kiosk_web_root }}/media"
  register: xibo_kiosk_media_stat
  when: xibo_kiosk_enabled | bool

- name: Alten media-Symlink entfernen
  ansible.builtin.file:
    path: "{{ xibo_kiosk_web_root }}/media"
    state: absent
  when:
    - xibo_kiosk_enabled | bool
    - xibo_kiosk_media_stat.stat.islnk | default(false)

- name: Lokales Bilder-Cache-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ xibo_kiosk_web_root }}/media"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xibo_kiosk_enabled | bool

- name: Statische Slideshow-Dateien deployen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ xibo_kiosk_web_root }}/{{ item }}"
    owner: "{{ xibo_kiosk_user }}"
    group: "{{ xibo_kiosk_user }}"
    mode: "0644"
  loop:
    - index.html
    - slideshow.css
    - slideshow.js
    - default.svg
  when: xibo_kiosk_enabled | bool

- name: Slideshow-Konfiguration (config.js) deployen
  ansible.builtin.template:
    src: xibosignage-config.js.j2
    dest: "{{ xibo_kiosk_web_root }}/config.js"
    owner: "{{ xibo_kiosk_user }}"
    group: "{{ xibo_kiosk_user }}"
    mode: "0644"
  when: xibo_kiosk_enabled | bool

- name: Leeres manifest.js anlegen (bis der erste Sync-Lauf es ersetzt)
  ansible.builtin.copy:
    content: "window.XIBO_MANIFEST=[];\n"
    dest: "{{ xibo_kiosk_web_root }}/manifest.js"
    owner: root
    group: root
    mode: "0644"
    force: false
  when: xibo_kiosk_enabled | bool

- name: Sync- und Diagnose-Skript deployen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - xibosignage-sync.py
    - xibosignage-diagnose.sh
  when: xibo_kiosk_enabled | bool

- name: Sync-systemd-Service + Timer deployen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - xibosignage-sync.service
    - xibosignage-sync.timer
  when: xibo_kiosk_enabled | bool
  notify: Restart xibosignage sync timer

- name: Bildschirmmodus-Skript deployen
  ansible.builtin.template:
    src: xibosignage-display-mode.sh.j2
    dest: /usr/local/bin/xibosignage-display-mode.sh
    owner: root
    group: root
    mode: "0755"
  when: xibo_kiosk_enabled | bool

- name: Kiosk-Start-Skript deployen
  ansible.builtin.template:
    src: xibosignage-kiosk-start.sh.j2
    dest: /usr/local/bin/xibosignage-kiosk-start.sh
    owner: root
    group: root
    mode: "0755"
  when: xibo_kiosk_enabled | bool

- name: Drop-in-Verzeichnis für den apt-Exporter anlegen
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter-apt.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xibo_kiosk_enabled | bool

- name: apt-Exporter im Boot niedrig priorisieren
  ansible.builtin.copy:
    content: |
      [Service]
      Nice=19
      CPUWeight=20
      IOSchedulingClass=idle
    dest: /etc/systemd/system/prometheus-node-exporter-apt.service.d/low-priority.conf
    owner: root
    group: root
    mode: "0644"
  when: xibo_kiosk_enabled | bool
  notify: Reload systemd

- name: Eindeutig unkritische Dienste deaktivieren
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ xibo_kiosk_disable_services }}"
  when: xibo_kiosk_enabled | bool
  failed_when: false

- name: Desktop-Sitzung abschalten
  when: xibo_kiosk_enabled | bool
  block:
    - name: lightdm stoppen und maskieren
      ansible.builtin.systemd:
        name: lightdm
        enabled: false
        state: stopped
        masked: true
      failed_when: false

    - name: Standard-Target auf multi-user setzen
      ansible.builtin.file:
        src: /lib/systemd/system/multi-user.target
        dest: /etc/systemd/system/default.target
        state: link
        force: true

- name: Kiosk per systemd früh im Boot starten
  when:
    - xibo_kiosk_enabled | bool
    - xibo_kiosk_start_mode == 'systemd'
  block:
    - name: Autologin-Drop-in für getty@tty1 entfernen
      ansible.builtin.file:
        path: /etc/systemd/system/getty@tty1.service.d/autologin.conf
        state: absent
      notify: Reload systemd

    - name: X11-Start aus .profile des Kiosk-Users entfernen
      ansible.builtin.blockinfile:
        path: "/home/{{ xibo_kiosk_user }}/.profile"
        marker: "# {mark} ANSIBLE MANAGED BLOCK (xibo_kiosk role)"
        state: absent

    - name: X11- und Kiosk-Service deployen
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - xibosignage-xorg.service
        - xibosignage-kiosk.service
      notify: Reload systemd

    - name: X11- und Kiosk-Service für den nächsten Boot aktivieren
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        enabled: true
      loop:
        - xibosignage-xorg.service
        - xibosignage-kiosk.service

- name: Kiosk per Autologin und startx starten
  when:
    - xibo_kiosk_enabled | bool
    - xibo_kiosk_start_mode == 'getty'
  block:
    - name: X11- und Kiosk-Service deaktivieren
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
      loop:
        - xibosignage-kiosk.service
        - xibosignage-xorg.service
      failed_when: false

    - name: X11- und Kiosk-Service-Dateien löschen
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - xibosignage-kiosk.service
        - xibosignage-xorg.service
      notify: Reload systemd

    - name: Verzeichnis für getty@tty1-Drop-in anlegen
      ansible.builtin.file:
        path: /etc/systemd/system/getty@tty1.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Autologin-Drop-in für getty@tty1 deployen
      ansible.builtin.template:
        src: getty-autologin.conf.j2
        dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: X11-Start in .profile des Kiosk-Users eintragen
      ansible.builtin.blockinfile:
        path: "/home/{{ xibo_kiosk_user }}/.profile"
        create: true
        owner: "{{ xibo_kiosk_user }}"
        group: "{{ xibo_kiosk_user }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK (xibo_kiosk role)"
        block: |
          if [ -z "${DISPLAY:-}" ] && [ "$(tty)" = "/dev/tty1" ]; then
            exec startx /usr/local/bin/xibosignage-kiosk-start.sh -- :0 vt1 -nolisten tcp -s 0 -dpms
          fi

- name: Slideshow-Sync aktivieren
  ansible.builtin.systemd:
    name: xibosignage-sync.timer
    daemon_reload: true
    enabled: true
    state: started
  when: xibo_kiosk_enabled | bool

- name: Ersten Sync einmalig ausführen (Cache vorbefüllen, Fehler sind unkritisch)
  ansible.builtin.systemd:
    name: xibosignage-sync.service
    state: started
  when: xibo_kiosk_enabled | bool
  failed_when: false

- name: Slideshow-Sync deaktivieren (xibo_kiosk_enabled false)
  ansible.builtin.systemd:
    name: xibosignage-sync.timer
    enabled: false
    state: stopped
  when: not (xibo_kiosk_enabled | bool)
  failed_when: false
