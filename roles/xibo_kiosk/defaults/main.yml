---
xibo_kiosk_enabled: true

xibo_kiosk_nfs_server: "192.168.178.97"
xibo_kiosk_nfs_path: "/volume1/k8s-storage/xibosignage-display"
xibo_kiosk_mount_point: "/mnt/xibosignage-display"

xibo_kiosk_web_root: "/var/www/xibosignage-slideshow"

xibo_kiosk_sync_interval_seconds: 30
xibo_kiosk_sync_boot_delay_seconds: 20
xibo_kiosk_sync_settle_seconds: 5
xibo_kiosk_manifest_reload_seconds: 10

xibo_kiosk_slide_duration_ms: 10000

xibo_kiosk_image_max_width: 1920
xibo_kiosk_image_max_height: 1080
xibo_kiosk_image_jpeg_quality: 85

xibo_kiosk_cursor_hide_seconds: 3

xibo_kiosk_display_poll_seconds: 5
xibo_kiosk_display_mode: ""
xibo_kiosk_pixel_aspect: auto

xibo_kiosk_user: "pi"

xibo_kiosk_start_mode: systemd
xibo_kiosk_supplementary_groups:
  - video
  - render

xibo_kiosk_chromium_extra_flags: []

xibo_kiosk_disable_services:
  - ModemManager.service
  - triggerhappy.service
  - cups-browsed.service
  - cups.service
  - cups.socket
  - e2scrub_reap.service
  - upower.service
