---
xibo_kiosk_enabled: true

xibo_kiosk_nfs_server: "192.168.178.97"
xibo_kiosk_nfs_path: "/volume1/k8s-storage/xibosignage-display"
xibo_kiosk_mount_point: "/mnt/xibosignage-display"

xibo_kiosk_web_root: "/var/www/xibosignage-slideshow"

xibo_kiosk_sync_interval_seconds: 30
xibo_kiosk_sync_boot_delay_seconds: 20
xibo_kiosk_sync_settle_seconds: 5
xibo_kiosk_manifest_reload_seconds: 10
# Wartezeit, bevor eine aus der Quelle verschwundene Bilddatei lokal geloescht
# wird. Verhindert, dass der Browser mit einem noch nicht aktualisierten
# Manifest auf eine bereits geloeschte Datei trifft (404 -> Slide wird sofort
# uebersprungen statt die volle Anzeigedauer zu laufen). Sollte deutlich ueber
# xibo_kiosk_manifest_reload_seconds liegen.
xibo_kiosk_orphan_grace_seconds: 30

xibo_kiosk_slide_duration_ms: 20000

xibo_kiosk_image_max_width: 1920
xibo_kiosk_image_max_height: 1080
xibo_kiosk_image_jpeg_quality: 85

xibo_kiosk_cursor_hide_seconds: 3

xibo_kiosk_display_poll_seconds: 5
xibo_kiosk_display_mode: "1920x1080"
xibo_kiosk_pixel_aspect: auto

# Manche Displays/Kabel liefern kein EDID (0 Bytes), wodurch der vc4-KMS-Treiber
# xibo_kiosk_display_mode nie als gueltigen Modus akzeptiert ("Configure crtc
# 0 failed"). Mit xibo_kiosk_edid_force wird stattdessen eine synthetische
# EDID-Datei per drm.edid_firmware= Kernel-Parameter erzwungen. Die Datei via
# scripts/generate-edid.py erzeugen (siehe dortige Kommentare) und das Ergebnis
# als xibo_kiosk_edid_base64 in host_vars hinterlegen; sie muss zu
# xibo_kiosk_display_mode passen. Nach einer Aenderung ist ein Reboot des
# Geraets noetig, da es sich um einen Kernel-cmdline-Parameter handelt.
xibo_kiosk_edid_force: false
xibo_kiosk_edid_connector: ""
xibo_kiosk_edid_filename: "{{ xibo_kiosk_display_mode }}.bin"
xibo_kiosk_edid_base64: ""

xibo_kiosk_user: "pi"

xibo_kiosk_start_mode: systemd
xibo_kiosk_supplementary_groups:
  - video
  - render

xibo_kiosk_chromium_extra_flags: []

xibo_kiosk_disable_services:
  - ModemManager.service
  - triggerhappy.service
  - cups-browsed.service
  - cups.service
  - cups.socket
  - e2scrub_reap.service
  - upower.service
