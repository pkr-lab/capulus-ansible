---

- name: resource-watchdog-skript ablegen
  ansible.builtin.copy:
    src: resource-watchdog.sh
    dest: /usr/local/bin/resource-watchdog.sh
    owner: root
    group: root
    mode: "0755"
  when: resource_watchdog_enabled | bool
  notify: resource-watchdogs neu starten

- name: sicherstellen dass das konfigurationsverzeichnis des resource-watchdogs existiert
  ansible.builtin.file:
    path: /etc/resource-watchdog
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: resource_watchdog_enabled | bool

- name: umgebungsdateien je metrik ablegen
  ansible.builtin.template:
    src: instance.env.j2
    dest: "/etc/resource-watchdog/{{ item.name }}.env"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ resource_watchdog_metrics }}"
  loop_control:
    label: "{{ item.name }}"
  when: resource_watchdog_enabled | bool
  notify: resource-watchdogs neu starten

- name: systemd-template-unit des resource-watchdogs ablegen
  ansible.builtin.template:
    src: "resource-watchdog@.service.j2"
    dest: /etc/systemd/system/resource-watchdog@.service
    owner: root
    group: root
    mode: "0644"
  when: resource_watchdog_enabled | bool
  notify: resource-watchdogs neu starten

- name: resource-watchdog-instanzen aktivieren und starten
  ansible.builtin.systemd:
    name: "resource-watchdog@{{ item.name }}"
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ resource_watchdog_metrics }}"
  loop_control:
    label: "{{ item.name }}"
  when: resource_watchdog_enabled | bool

- name: resource-watchdog-instanzen deaktivieren, wenn resource_watchdog_enabled aus ist
  ansible.builtin.systemd:
    name: "resource-watchdog@{{ item.name }}"
    enabled: false
    state: stopped
  loop: "{{ resource_watchdog_metrics }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (resource_watchdog_enabled | bool)
  register: resource_watchdog_deaktivieren_result
  failed_when:
    - resource_watchdog_deaktivieren_result is failed
    - "'Could not find' not in (resource_watchdog_deaktivieren_result.msg | default(''))"
