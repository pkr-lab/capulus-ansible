name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: make lint (yamllint, ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install yamllint + ansible-lint
        run: pip install --disable-pip-version-check yamllint ansible-lint

      - name: Install Ansible Galaxy collections
        run: |
          for attempt in 1 2 3 4 5; do
            ansible-galaxy collection install -r requirements.yml && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      - name: make lint
        run: make lint

  ca-checksum:
    name: Root-CA entspricht capulus-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vergleich mit capulus-core
        run: |
          curl -fsSL https://raw.githubusercontent.com/pkr-lab/capulus-core/main/pki/homeserver-root-ca.pem -o "$RUNNER_TEMP/core-ca.pem"
          cmp "$RUNNER_TEMP/core-ca.pem" files/homeserver-root-ca.pem

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
